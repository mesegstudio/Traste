<div class="app">
  <nav class="rail" aria-label="Traste">
    <a class="rail-brand" href="#afinador" aria-label="Traste">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2.5c-7.4 0-12.5 3.2-12.5 8.6 0 6.6 6.6 14 11 18.1a2.2 2.2 0 0 0 3 0c4.4-4.1 11-11.5 11-18.1C28.5 5.7 23.4 2.5 16 2.5Z" fill="var(--accent)"/><path d="M9.5 11h13M11 15.5h10M13 20h6" stroke="var(--accent-ink)" stroke-width="1.9" stroke-linecap="round" opacity=".5"/></svg>
    </a>
    <a class="rail-item" href="#afinador" data-tab="afinador"><span data-icon="dashboard-3-line"></span>Afinar</a>
    <a class="rail-item" href="#aprender" data-tab="aprender"><span data-icon="graduation-cap-line"></span>Aprender</a>
    <a class="rail-item" href="#canciones" data-tab="canciones"><span data-icon="music-2-line"></span>Canciones</a>
    <div class="rail-end">
      <a class="rail-item" href="#ajustes" data-tab="ajustes"><span data-icon="settings-3-line"></span>Ajustes<i class="rail-dot" id="railMicDot" hidden></i></a>
    </div>
  </nav>

  <main class="views">
    <!-- ======================= AFINADOR ======================= -->
    <section class="view" data-view="afinador" hidden>
      <div class="tuner">
        <div class="t-main">
          <div class="t-top">
            <button type="button" class="mode-chip" id="tnMode"><i></i><span id="tnModeText">Automático</span></button>
            <span class="faint num text-sm" id="tnFreq"></span>
          </div>
          <div class="readout">
            <div class="note-big" id="tnNote"><i class="nb-idle"></i></div>
            <div class="sub" id="tnSub">Pulsa una cuerda al aire</div>
          </div>
          <div class="gauge" id="gauge" aria-hidden="true">
            <div class="band"></div>
            <div id="ticks"></div>
            <div class="needle" id="needle"></div>
          </div>
          <div class="gauge-scale num"><span>Grave</span><span>−25</span><span>0</span><span>+25</span><span>Aguda</span></div>
          <div class="hint" id="tnHint" aria-live="polite"></div>
          <button type="button" class="btn btn-soft btn-sm" id="tnNext" hidden>Ya está afinada, seguir con la práctica<span data-icon="arrow-right-line"></span></button>
        </div>
        <div class="t-strings">
          <div class="strings" id="tnStrings"></div>
          <div class="mic-card compact" data-mic-card></div>
        </div>
        <div class="overlay-cta" id="tunerCta">
          <div>
            <h3>Necesito oír tu guitarra</h3>
            <p>Activa el micrófono. El sonido se analiza en tu navegador y no sale de tu equipo.</p>
            <button type="button" class="btn btn-primary btn-lg" data-action="mic-on"><span data-icon="mic-line"></span>Activar micrófono</button>
          </div>
        </div>
      </div>
      <div class="cal-host overlay" hidden></div>
    </section>

    <!-- ======================= APRENDER ======================= -->
    <section class="view" data-view="aprender" hidden>
      <div class="learn" id="learn"></div>
      <div class="cal-host overlay" hidden></div>
    </section>

    <!-- ======================= CANCIONES ======================= -->
    <section class="view" data-view="canciones" hidden>
      <div class="list-pane" id="songList">
        <div class="list-top">
          <label class="search"><span data-icon="search-line"></span><input type="search" id="songSearch" placeholder="Buscar canción" aria-label="Buscar canción"></label>
          <button type="button" class="btn btn-soft" id="songAdd" title="Añadir una canción pegando sus acordes"><span data-icon="add-line"></span>Añadir</button>
          <div class="filters" id="songFilters"></div>
        </div>
        <div class="song-list scroll" id="songGrid"></div>
      </div>

      <div class="import" id="songImport" hidden></div>

      <div class="player" id="player" hidden>
        <div class="pl-top">
          <button type="button" class="btn btn-soft btn-icon" id="plBack" aria-label="Volver a las canciones"><span data-icon="arrow-left-line"></span></button>
          <div class="pl-title"><h1 id="plTitle">—</h1><p id="plOrigin"></p><button type="button" class="pl-chip" id="plChip" aria-label="Cambiar nivel y velocidad"></button></div>
          <div class="hud">
            <div><div class="pts num" id="plScore">0</div><div class="lbl" id="plScoreLbl">puntos</div></div>
            <div class="mult m1" id="plMult" title="Multiplicador por racha">×1</div>
          </div>
          <div class="pl-btns">
            <button type="button" class="btn btn-soft btn-icon pl-opts-btn" id="plOptsBtn" aria-label="Nivel y velocidad" aria-expanded="false"><span data-icon="equalizer-2-line"></span></button>
            <button type="button" class="btn btn-soft" id="plDemo"><span data-icon="headphone-line"></span><span>Escuchar</span></button>
            <button type="button" class="btn btn-soft btn-icon" id="plRestart" aria-label="Empezar desde el principio" title="Empezar desde el principio"><span data-icon="restart-line"></span></button>
            <button type="button" class="btn btn-primary btn-icon" id="plPlay" aria-label="Tocar"><span data-icon="play-fill"></span></button>
          </div>
        </div>
        <div class="pl-opts" id="plOpts">
          <div class="seg" id="plLevel" role="group" aria-label="Nivel"></div>
          <div class="speed" role="group" aria-label="Velocidad">
            <input type="range" id="plSpeed" min="0" max="3" step="1" value="1" aria-label="Velocidad" aria-valuetext="Lento">
            <div class="speed-labels" id="plSpeedLabels"></div>
          </div>
          <label class="toggle" title="La canción se para hasta que tocas cada nota. No puntúa."><input type="checkbox" id="plWait">Esperarme</label>
          <label class="toggle"><input type="checkbox" id="plMetro">Metrónomo</label>
          <div class="loop-ctl" title="Repite unos compases desde donde estés. Si te salen bien, la velocidad sube sola.">
            <span><span data-icon="repeat-line"></span>Repetir</span>
            <div class="seg seg-sm" id="plLoop" role="group" aria-label="Repetir un tramo"></div>
            <span class="loop-unit">compases</span>
          </div>
          <button type="button" class="btn btn-ghost btn-sm" id="plEdit" hidden><span data-icon="edit-line"></span>Editar canción</button>
        </div>
        <div class="cal-card" hidden></div>
        <div class="highway"><canvas id="hw" aria-label="Partitura. Toca para empezar o pausar y desliza para moverte"></canvas></div>
        <div class="now-strip" id="plLyrics" hidden>
          <div id="plNowText" class="now-text"></div>
          <div id="plNext" class="now-next"></div>
        </div>
      </div>
    </section>
    <!-- ======================= AJUSTES ======================= -->
    <section class="view" data-view="ajustes" hidden>
      <div class="settings scroll" id="settings"></div>
    </section>
  </main>
</div>

<!-- Resultado de canción -->
<div class="modal" id="resModal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="resTitle">
    <div class="stars mb-3" id="resStars"></div>
    <h2 id="resTitle">¡Bien tocado!</h2>
    <p class="muted mt-1" id="resText"></p>
    <div class="res-big" id="resBig"></div>
    <div class="res-grid" id="resGrid"></div>
    <div class="res-actions" id="resActions"></div>
  </div>
</div>
