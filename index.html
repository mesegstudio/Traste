/* Traste · app de pantalla completa
   Estructura: una barra de navegación (lateral; abajo en móvil vertical) y una vista que ocupa
   exactamente el resto de la pantalla. Nada de cabeceras ni títulos de sección: cada vista tiene un
   protagonista (cuerdas, diagrama, partitura) y los controles justos a su alrededor.
   Color: coral = acción, menta = bien, ámbar = casi, rojo = mal. Los cuatro colores de dedo solo
   significan dedos. */
:root {
  color-scheme: dark;
  --bg: #100e17;
  --bg-2: #0b0a11;
  --surface: #17141f;
  --surface-2: #201c2a;
  --surface-3: #2b2637;
  --line: #262132;
  --line-2: #383146;
  --text: #f4efe6;
  --muted: #a39dae;
  --faint: #6e6779;
  --accent: #ff6a3d;
  --accent-strong: #ff875f;
  --accent-ink: #1d0b05;
  --accent-soft: rgba(255, 106, 61, 0.14);
  --ok: #34d399;
  --ok-soft: rgba(52, 211, 153, 0.15);
  --warn: #ffb020;
  --bad: #ff4d6d;
  --f1: #4c8dff;
  --f2: #9b6bff;
  --f3: #ff5fa2;
  --f4: #ffc23d;
  --open: #f4efe6;
  --dot-ink: #120f19;
  --shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
  --font: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --display: 'Bricolage Grotesque', 'Inter', ui-sans-serif, system-ui, sans-serif;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --spring: cubic-bezier(.34, 1.56, .64, 1);
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg: #f6f4f1; --bg-2: #ece8f2; --surface: #ffffff; --surface-2: #f0edf5; --surface-3: #e4dfec;
    --line: #e6e1ec; --line-2: #d3ccdd; --text: #18141f; --muted: #5f5869; --faint: #958ea0;
    --accent: #ee5226; --accent-strong: #ff6a3d; --accent-ink: #ffffff; --accent-soft: rgba(238, 82, 38, 0.11);
    --ok: #0f9f6e; --ok-soft: rgba(15, 159, 110, 0.12); --warn: #c77d00; --bad: #e0304f;
    --f1: #2f74f0; --f2: #7c4df0; --f3: #e8408a; --f4: #e8a300; --open: #18141f; --dot-ink: #ffffff;
    --shadow: 0 20px 50px rgba(40, 20, 60, 0.16);
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f6f4f1; --bg-2: #ece8f2; --surface: #ffffff; --surface-2: #f0edf5; --surface-3: #e4dfec;
  --line: #e6e1ec; --line-2: #d3ccdd; --text: #18141f; --muted: #5f5869; --faint: #958ea0;
  --accent: #ee5226; --accent-strong: #ff6a3d; --accent-ink: #ffffff; --accent-soft: rgba(238, 82, 38, 0.11);
  --ok: #0f9f6e; --ok-soft: rgba(15, 159, 110, 0.12); --warn: #c77d00; --bad: #e0304f;
  --f1: #2f74f0; --f2: #7c4df0; --f3: #e8408a; --f4: #e8a300; --open: #18141f; --dot-ink: #ffffff;
  --shadow: 0 20px 50px rgba(40, 20, 60, 0.16);
}

[hidden] { display: none !important; }
html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
body { color: var(--text); background: var(--bg); font-family: var(--font); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; letter-spacing: -0.025em; }
::selection { background: var(--accent-soft); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 10px; }
.ri { width: 1.15em; height: 1.15em; flex: none; display: inline-block; vertical-align: -0.2em; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }

/* ---------- Estructura de la app ---------- */
.app { display: flex; height: 100%; padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.views { position: relative; flex: 1; min-width: 0; min-height: 0; }
.view { position: absolute; inset: 0; display: flex; flex-direction: column; min-height: 0; padding: 18px 22px; }
.scroll { overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; min-height: 0; }

/* Barra de navegación: lateral por defecto, abajo en móvil vertical */
.rail { flex: none; width: 84px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 14px 6px; background: var(--bg-2); border-right: 1px solid var(--line); z-index: 30; }
.rail-brand { display: grid; place-items: center; width: 44px; height: 44px; margin-bottom: 12px; }
.rail-brand svg { width: 30px; height: 30px; }
.rail-item { position: relative; width: 70px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 0 8px; border-radius: 16px; border: 0; background: transparent; color: var(--faint); font: 600 11.5px/1.1 var(--font); text-decoration: none; cursor: pointer; transition: color .2s, background .2s; }
.rail-item .ri { width: 23px; height: 23px; }
.rail-item:hover { color: var(--text); }
.rail-item[aria-current="page"] { color: var(--text); background: var(--surface-2); }
.rail-item[aria-current="page"] .ri { color: var(--accent); }
.rail-end { margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.rail-dot { position: absolute; top: 8px; right: 19px; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px var(--bg-2); }

@media (orientation: portrait) and (max-width: 760px) {
  .app { flex-direction: column; }
  .views { order: 1; }
  .rail { order: 2; width: auto; flex-direction: row; justify-content: space-around; align-items: stretch; gap: 0; padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px)); border-right: 0; border-top: 1px solid var(--line); }
  .rail-brand { display: none; }
  .rail-end { margin: 0; flex-direction: row; display: contents; }
  .rail-item { flex: 1; width: auto; padding: 8px 0 6px; }
  .view { padding: 14px 16px; }
}
@media (max-height: 520px) {
  .rail { padding: 8px 6px; gap: 2px; }
  .rail-brand { display: none; }
  .rail-item { padding: 6px 0; gap: 3px; }
  .rail-item .ri { width: 20px; height: 20px; }
  .view { padding: 10px 16px; }
}

/* ---------- Botones y controles ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 42px; padding: 0 18px; border-radius: 999px; font: 600 14.5px/1 var(--font); border: 0; cursor: pointer; transition: background .2s var(--ease), color .2s, transform .15s var(--ease); white-space: nowrap; user-select: none; color: var(--text); background: transparent; flex: none; }
.btn:active { transform: scale(.96); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { background: var(--accent-strong); }
.btn-soft { background: var(--surface-2); }
.btn-soft:hover { background: var(--surface-3); }
.btn-ghost { color: var(--muted); }
.btn-ghost:hover { color: var(--text); background: var(--surface-2); }
.btn-lg { height: 50px; padding: 0 24px; font-size: 15.5px; }
.btn-sm { height: 36px; padding: 0 14px; font-size: 13.5px; }
.btn-icon { width: 42px; padding: 0; }
.btn-lg.btn-icon { width: 50px; }
.btn-sm.btn-icon { width: 36px; }
.seg { display: inline-flex; padding: 4px; background: var(--surface-2); border-radius: 999px; gap: 2px; flex: none; }
.seg button { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 14px; border-radius: 999px; font: 600 13.5px/1 var(--font); color: var(--muted); background: transparent; border: 0; cursor: pointer; transition: all .2s var(--ease); white-space: nowrap; }
.seg button:hover { color: var(--text); }
.seg button .ri { width: 16px; height: 16px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 2px 8px rgba(0, 0, 0, .2); }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border-radius: 999px; font: 600 13.5px/1 var(--font); color: var(--muted); background: var(--surface-2); border: 0; cursor: pointer; transition: all .2s; white-space: nowrap; flex: none; }
.chip:hover { color: var(--text); }
.chip:disabled { opacity: .4; cursor: not-allowed; }
.chip[aria-pressed="true"] { background: var(--text); color: var(--bg); }
.toggle { display: inline-flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); cursor: pointer; user-select: none; }
.toggle input { appearance: none; width: 36px; height: 22px; border-radius: 22px; background: var(--surface-3); position: relative; cursor: pointer; transition: background .2s; flex: none; margin: 0; }
.toggle input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--muted); transition: transform .25s var(--spring), background .2s; }
.toggle input:checked { background: var(--accent-soft); }
.toggle input:checked::after { transform: translateX(14px); background: var(--accent); }
.toggle:hover { color: var(--text); }
input[type="range"] { appearance: none; height: 4px; border-radius: 4px; background: var(--surface-3); outline-offset: 6px; }
input[type="range"]::-webkit-slider-thumb { appearance: none; width: 18px; height: 18px; border-radius: 50%; background: var(--text); border: 4px solid var(--surface); box-shadow: 0 0 0 1px var(--line-2); cursor: pointer; }
input[type="range"]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--text); border: 4px solid var(--surface); cursor: pointer; }
select, input[type="search"] { background: var(--surface-2); border: 0; color: var(--text); border-radius: 12px; font: 14px/1.4 var(--font); }
select { height: 36px; padding: 0 10px; max-width: 220px; }
.link-btn { background: none; border: 0; padding: 0; color: var(--muted); font: 500 13.5px/1.4 var(--font); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.link-btn:hover { color: var(--text); }
.tip { display: flex; gap: 10px; font-size: 14px; color: var(--muted); }
.tip .ri { color: var(--accent); margin-top: 2px; }
.dots { display: inline-flex; gap: 3px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--surface-3); }
.dots i.on { background: var(--accent); }
.overlay-cta { position: absolute; inset: 0; z-index: 6; display: grid; place-items: center; text-align: center; padding: 24px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); }
.overlay-cta h3 { font-size: 26px; }
.overlay-cta p { color: var(--muted); max-width: 36ch; margin: 8px auto 20px; }

/* ---------- Tarjeta del micrófono ---------- */
.mic-card { padding: 12px 14px; border-radius: 18px; background: var(--surface); }
.mc-row { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 12px; align-items: center; }
.mc-ico { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--ok-soft); color: var(--ok); }
.mc-ico.off { background: var(--surface-2); color: var(--faint); }
.mc-ico .ri { width: 19px; height: 19px; }
.mc-txt { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.mc-txt b { font-weight: 650; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mc-txt > span { font-size: 13px; color: var(--muted); }
.mc-txt select { width: 100%; height: 34px; max-width: 100%; padding: 0 8px; font-weight: 600; font-size: 14px; text-overflow: ellipsis; }
.mc-status { margin-top: 8px; }
@media (max-width: 480px) {
  .set-card .mc-row { grid-template-columns: 36px minmax(0, 1fr); }
  .set-card .mc-row .btn { grid-column: 1 / -1; justify-self: start; }
}
.mc-st { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 550; }
.mc-st .ri { width: 15px; height: 15px; }
.mc-st.ok { color: var(--ok); }
.mc-st.warn { color: var(--warn); }
.mc-meter { margin-top: 10px; }
.mc-meter .lv { position: relative; height: 8px; border-radius: 8px; background: var(--surface-3); }
.mc-meter .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 8px; background: var(--faint); transition: width .08s linear, background .2s; }
.mc-meter .fill.hot { background: var(--ok); }
.mc-meter .gate { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; border-radius: 2px; background: var(--text); }
.mc-meter > span { display: block; margin-top: 6px; font-size: 12.5px; color: var(--faint); }
.mc-off { margin-top: 10px; font-size: 13px; }

/* ---------- Comprobación del micrófono ---------- */
.cal-host.overlay { position: absolute; inset: 0; z-index: 7; background: var(--bg); display: grid; place-items: center; padding: 20px; overflow: auto; }
.cal-card { flex: 1; min-height: 0; overflow: auto; display: grid; place-items: center; padding: 20px; }
.cal-card:not([hidden]) ~ .highway, .cal-card:not([hidden]) ~ .now-strip { display: none; }
.set-card .cal-host { padding: 18px 4px 4px; }
.cal { width: min(420px, 100%); display: flex; flex-direction: column; gap: 14px; }
.cal h3 { font-size: 24px; }
.cal-list { display: flex; flex-direction: column; gap: 10px; }
.cal-item { display: grid; grid-template-columns: 28px 1fr; gap: 12px; align-items: start; font-size: 14px; }
.cal-item .st { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); color: var(--muted); font-weight: 700; font-size: 12.5px; }
.cal-item .st .ri { width: 16px; height: 16px; }
.cal-item b { font-weight: 600; display: block; }
.cal-item p { color: var(--muted); font-size: 13.5px; }
.cal-item[data-s="run"] .st { background: var(--accent-soft); color: var(--accent); animation: pulse 1.4s infinite; }
.cal-item[data-s="ok"] .st { background: var(--ok); color: var(--dot-ink); }
.cal-item[data-s="warn"] .st { background: var(--warn); color: var(--dot-ink); }
.cal-item .res { font-size: 13.5px; margin-top: 3px; }
.vol-note { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-radius: 16px; background: var(--accent-soft); color: var(--accent); font-size: 14px; font-weight: 600; }
.vol-note .ri { width: 20px; height: 20px; }
.bar { height: 5px; border-radius: 5px; background: var(--surface-3); overflow: hidden; }
.bar > div { height: 100%; width: 0; background: var(--ok); border-radius: 5px; transition: width .08s linear; }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 var(--accent-soft); } 50% { box-shadow: 0 0 0 9px transparent; } }

/* ---------- Afinador ---------- */
.tuner { position: relative; flex: 1; min-height: 0; display: grid; grid-template-rows: auto minmax(0, max-content); align-content: center; gap: clamp(10px, 3vh, 36px); width: 100%; max-width: 980px; margin: 0 auto; }
.t-main { display: flex; flex-direction: column; justify-content: center; min-height: 0; }
.t-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.mode-chip { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 999px; border: 0; background: var(--surface-2); color: var(--text); font: 600 13.5px/1 var(--font); cursor: pointer; }
.mode-chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 4px var(--ok-soft); }
.mode-chip.manual i { background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.mode-chip .ri { width: 16px; height: 16px; color: var(--muted); }
.readout { text-align: center; margin: 6px 0 2px; }
.note-big { font-family: var(--display); font-size: clamp(64px, 13vh, 132px); font-weight: 700; line-height: 1; letter-spacing: -0.05em; transition: color .25s, transform .3s var(--spring); }
.note-big.pop { transform: scale(1.06); }
.note-big small { font-size: .26em; font-weight: 600; color: var(--muted); letter-spacing: 0; margin-left: 6px; }
.readout .sub { color: var(--muted); margin-top: 6px; min-height: 21px; font-size: 14px; }
.gauge { position: relative; height: clamp(54px, 9vh, 84px); margin: 6px 6px 2px; }
.gauge .band { position: absolute; top: 4px; bottom: 4px; left: 45%; width: 10%; border-radius: 14px; background: var(--ok-soft); transition: background .25s, box-shadow .25s; }

.gauge-scale { display: flex; justify-content: space-between; color: var(--faint); font-size: 12px; padding: 0 2px; }
.hint { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 34px; margin-top: 6px; font-size: 17px; font-weight: 650; }

.t-strings { display: flex; flex-direction: column; justify-content: center; min-height: 0; gap: 8px; }
.t-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 36px; padding: 0 6px; }
.t-prog { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; }

.strings { flex: 0 1 auto; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 2px; }
.str { flex: 0 1 54px; height: 54px; min-height: 32px; display: grid; grid-template-columns: 50px 1fr 52px; align-items: center; gap: 12px; padding: 0 6px; border-radius: 16px; cursor: pointer; border: 0; background: transparent; color: inherit; font: inherit; text-align: left; transition: background .2s; }
.str:hover { background: var(--surface); }
.str .peg { width: auto; height: min(40px, calc(100% - 4px)); aspect-ratio: 1; justify-self: center; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); font-family: var(--display); font-weight: 700; font-size: 14.5px; transition: all .3s var(--spring); }

.str.sel { background: var(--surface); }

.str.active .wire path { opacity: 1; }
.str.active .peg { transform: scale(1.08); box-shadow: 0 0 0 5px var(--surface-3); }
.str.done .peg { background: var(--ok); color: var(--dot-ink); }
.str.done .info { color: var(--ok); }
/* horizontal / pantallas anchas: dos columnas */
@media (min-aspect-ratio: 5/4) {
  .tuner { grid-template-rows: minmax(0, 1fr); grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 40px; align-items: stretch; align-content: stretch; }

}

}

  .hint { font-size: 15px; min-height: 28px; margin-top: 2px; }

/* ---------- Pantallas internas (aprender) ---------- */
.learn { flex: 1; min-height: 0; display: flex; flex-direction: column; }

/* inicio */

@media (min-width: 880px), (min-aspect-ratio: 5/4) and (min-width: 640px) {

.lvl-pips i.on { background: var(--muted); }

/* lección de un acorde */
.stepper { flex: none; display: flex; align-items: center; gap: 4px; overflow-x: auto; scrollbar-width: none; }

.stepper button { flex: none; display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px 0 6px; border-radius: 999px; border: 0; background: transparent; color: var(--muted); font: 600 14px/1 var(--font); cursor: pointer; transition: background .2s, color .2s; }
.stepper button:hover { color: var(--text); }
.stepper button i { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); font-style: normal; font-size: 13px; font-weight: 700; }
.stepper button i .ri { width: 16px; height: 16px; }
.stepper button[aria-selected="true"] { background: var(--surface-2); color: var(--text); }

.ls-grid { display: grid; gap: 16px 36px; grid-template-columns: minmax(0, 1fr); max-width: 1040px; margin: 0 auto; align-items: start; }

.diagram.sm svg { max-height: clamp(110px, 24vh, 200px); }
.ls-panel { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

.rec-line { display: inline-flex; align-items: center; gap: 6px; margin-top: 4px; color: var(--text); }

}

.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); }

/* ejercicios */

.dr-intro { flex: none; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 20px; }
.dr-why { flex: 1 1 380px; color: var(--muted); font-size: 14.5px; max-width: 75ch; }
.dr-stage { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: safe center; gap: 16px; padding: 16px; border-radius: 24px; background: var(--bg-2); overflow: auto; }
.neck-wrap { width: 100%; min-height: 0; display: flex; overflow-x: auto; scrollbar-width: thin; }

@keyframes ring { 0% { opacity: .9; transform: scale(.75); } 100% { opacity: 0; transform: scale(1.25); } }

.dr-bar { flex: 0 0 90px; height: 6px; border-radius: 6px; background: var(--surface-3); overflow: hidden; }

.chg-pair { display: flex; align-items: center; justify-content: center; gap: 14px; width: 100%; }

.rh-pattern i { font-style: normal; display: grid; place-items: center; height: 28px; font-size: 22px; font-weight: 700; color: var(--faint); }
.rh-pattern i .ri { width: 26px; height: 26px; }
.rh-pattern .D i { color: var(--accent); }
.rh-pattern .U i { color: var(--text); }
.rh-pattern .rest { background: transparent; box-shadow: inset 0 0 0 1.5px var(--line); }
.rh-pattern em { font-style: normal; font-size: 12px; font-weight: 650; color: var(--muted); }
.rh-seq { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; max-width: 520px; }
.rh-seq span { min-width: 44px; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); font-size: 13px; font-weight: 650; text-align: center; }
.rh-seq span.rep { color: var(--faint); background: transparent; box-shadow: inset 0 0 0 1px var(--line-2); }
.rhythm-chords { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.rhythm-chords .diagram { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.rhythm-chords .diagram svg { max-height: clamp(90px, 20vh, 170px); }
@media (max-width: 640px) { .rhythm-chords .diagram svg { max-height: 110px; } .rhythm-chords { gap: 6px; } }
@media (max-height: 520px) { .rhythm-chords { display: none; } }
.dr-foot { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 50px; }
.dr-msg { flex: 1; min-width: 0; font-size: 15px; font-weight: 650; }
.dr-msg[data-k=""] { color: var(--muted); font-weight: 450; font-size: 14px; }
.dr-msg[data-k="ok"] { color: var(--ok); }
.dr-msg[data-k="bad"] { color: var(--bad); }
.dr-msg[data-k="warn"] { color: var(--warn); }
@media (max-width: 640px) {
  .drill .scr-title p { display: none; }
  .dr-stats { gap: 12px; }
  .dr-stat b { font-size: 20px; }
  .chg-pair { gap: 8px; }
  .dr-why { font-size: 14px; }
}
@media (max-height: 520px) {
  .dr-why { display: none; }
  .dr-stage { padding: 10px; gap: 8px; }
  .find-target b { font-size: 52px; }
  .dr-foot { min-height: 44px; }
  .drill .scr-title p { display: none; }
}

/* ---------- Ajustes ---------- */
.settings { flex: 1; }
.set-wrap { max-width: 700px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; padding-bottom: 20px; }
.set-title { font-size: 30px; }
.set-card { padding: 18px; border-radius: 24px; background: var(--surface); }
.set-card .mic-card { background: var(--bg-2); }
.set-head h2 { display: flex; align-items: center; gap: 8px; font-size: 19px; }
.set-head h2 .ri { color: var(--accent); }
.set-head p { color: var(--muted); font-size: 14px; margin: 6px 0 14px; }
.set-head p b { color: var(--text); font-weight: 600; }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 10px 18px; padding: 14px 0; border-top: 1px solid var(--line); }
.set-row:first-child { border-top: 0; padding-top: 2px; }
.set-row:last-child { padding-bottom: 2px; }
.set-row h3 { font-family: var(--font); font-size: 15px; font-weight: 650; letter-spacing: 0; }
.set-row p { color: var(--muted); font-size: 13.5px; }
.set-preview { display: flex; align-items: center; gap: 16px; padding: 4px 0 14px; }
.set-preview .diagram svg { max-height: 150px; }
.set-preview p { color: var(--faint); font-size: 13px; }
.set-foot { text-align: center; color: var(--faint); font-size: 13px; padding: 4px 16px; }
@media (max-width: 600px) {
  .set-row { flex-direction: column; align-items: flex-start; }
}

/* ---------- Canciones: catálogo ---------- */
.list-pane { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; }
.list-top { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.search { position: relative; flex: 1 1 240px; max-width: 420px; }
.search .ri { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--faint); }
.search input { width: 100%; height: 42px; padding: 0 16px 0 42px; border-radius: 999px; font-size: 15px; }
.filters { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; flex: 1 1 auto; min-width: 0; }
.filters::-webkit-scrollbar { display: none; }
.song-list { flex: 1; display: grid; gap: 2px 20px; align-content: start; }
@media (min-width: 900px) { .song-list { grid-template-columns: 1fr 1fr; } }
.song-row { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 10px 12px 10px 10px; border-radius: 18px; cursor: pointer; transition: background .2s; }
.song-row:hover { background: var(--surface); }
.song-row .art { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 19px; color: var(--text); background: var(--surface-2); transition: background .2s, color .2s; }
.song-row:hover .art { background: var(--accent); color: var(--accent-ink); }
.song-row h3 { font-family: var(--font); font-size: 15.5px; font-weight: 650; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.song-row .meta { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.song-row .best { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; font-size: 11.5px; color: var(--faint); }
.mini-stars { display: inline-flex; gap: 1px; color: var(--surface-3); }
.mini-stars .ri { width: 13px; height: 13px; }
.mini-stars .on { color: var(--accent); }
.empty { padding: 40px 0; text-align: center; color: var(--muted); }

/* ---------- Canciones: reproductor (llena la pantalla) ---------- */
.player { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
.pl-top { flex: none; display: flex; align-items: center; gap: 10px; }
.pl-title { min-width: 0; flex: 1; }
.pl-title h1 { font-size: 22px; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pl-title p { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hud { display: flex; gap: 10px; align-items: center; flex: none; }
.hud .pts { font-family: var(--display); font-size: 24px; font-weight: 700; letter-spacing: -0.02em; line-height: 1; text-align: right; }
.hud .lbl { font-size: 11.5px; color: var(--muted); text-align: right; }
.mult { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 50%; font-family: var(--display); font-weight: 800; font-size: 15px; background: var(--surface-2); color: var(--muted); transition: transform .3s var(--spring), background .3s, color .3s; }
.mult.m2 { background: var(--f1); color: #fff; } .mult.m3 { background: var(--f2); color: #fff; } .mult.m4 { background: var(--accent); color: var(--accent-ink); }
.mult.bump { transform: scale(1.25); }
.pl-btns { display: flex; gap: 6px; flex: none; }
.pl-opts { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; }
.pl-opts-btn { display: none; }
.speed { display: flex; flex-direction: column; gap: 6px; width: 260px; padding-top: 4px; }
.speed input { width: 100%; }
.speed-labels { position: relative; height: 16px; font-size: 12px; color: var(--faint); font-weight: 600; }
.speed-labels span { position: absolute; top: 0; transform: translateX(-50%); white-space: nowrap; cursor: pointer; }
.speed-labels span:first-child { transform: none; left: 0 !important; }
.speed-labels span:last-child { transform: translateX(-100%); }
.speed-labels span.normal { color: var(--warn); }
.speed-labels span.on { color: var(--text); }
.speed-labels span.normal.on { color: var(--warn); text-decoration: underline; text-underline-offset: 4px; }
.highway { flex: 1; min-height: 120px; background: var(--bg-2); border-radius: 22px; overflow: hidden; }
.highway canvas { display: block; width: 100%; height: 100%; touch-action: pan-y; cursor: grab; user-select: none; -webkit-user-select: none; }
.highway canvas:active { cursor: grabbing; }
.now-strip { flex: none; display: flex; align-items: center; gap: 12px; padding: 2px 4px; }
.now-text { font-size: 15.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.now-text b { font-weight: 700; }
.now-text .ri { vertical-align: -0.25em; }
#plFingersBtn .chev { transition: transform .2s; }
#plFingersBtn[aria-expanded="true"] .chev { transform: rotate(180deg); }
.sheet { position: absolute; left: 0; right: 0; bottom: 52px; z-index: 8; max-height: calc(100% - 120px); overflow: auto; padding: 16px; border-radius: 22px; background: var(--surface); box-shadow: var(--shadow); display: grid; gap: 14px; align-items: center; animation: rise .3s var(--spring); }
@media (min-width: 900px) { .sheet { grid-template-columns: minmax(0, 1fr) 190px; left: auto; width: min(820px, 100%); } }
.fret-wrap { overflow-x: auto; }
.fret-wrap svg { display: block; width: 100%; max-width: 580px; height: auto; margin: 0 auto; }
/* pantallas estrechas o bajas: las opciones del reproductor van en un panel */
@media (max-width: 899px), (max-height: 600px) {
  .pl-opts-btn { display: inline-flex; }
  .pl-opts { position: absolute; top: 54px; right: 0; z-index: 9; flex-direction: column; align-items: stretch; gap: 16px; width: min(320px, 100%); padding: 18px; border-radius: 22px; background: var(--surface); box-shadow: var(--shadow); animation: rise .3s var(--spring); }
  .pl-opts:not(.open) { display: none; }
  .speed { width: 100%; }
}
@media (max-width: 560px) {
  .pl-title h1 { font-size: 18px; }
  .pl-title p { display: none; }
  .hud .pts { font-size: 20px; }
  .mult { width: 36px; height: 36px; font-size: 13.5px; }
  .pl-btns .btn { width: 38px; height: 38px; }
  #plDemo span { display: none; }
}
@media (max-height: 520px) {
  .pl-title h1 { font-size: 17px; }
  .pl-title p { display: none; }
  .player { gap: 6px; }
}

/* ---------- Modal y avisos ---------- */
.modal { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; background: rgba(8, 6, 12, .62); backdrop-filter: blur(8px); padding: 16px; }
.modal-card { width: min(460px, 100%); max-height: 100%; overflow: auto; background: var(--surface); border-radius: 30px; padding: 26px 24px 22px; box-shadow: var(--shadow); animation: rise .45s var(--spring); text-align: center; }
@keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.97); } }
.modal-card h2 { font-size: 27px; }
.stars { display: flex; gap: 8px; justify-content: center; color: var(--surface-3); }
.stars .ri { width: 44px; height: 44px; }
.stars .on { color: var(--accent); animation: star .5s var(--spring) both; }
.stars .on:nth-child(2) { animation-delay: .15s; } .stars .on:nth-child(3) { animation-delay: .3s; }
@keyframes star { from { transform: scale(0) rotate(-40deg); } }
.res-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 16px; }
.res-grid div { padding: 10px 4px; border-radius: 14px; background: var(--surface-2); }
.res-grid b { display: block; font-family: var(--display); font-size: 21px; }
.res-grid span { font-size: 12px; color: var(--muted); }
.res-big { display: flex; justify-content: center; gap: 26px; margin-top: 14px; }
.res-big b { display: block; font-family: var(--display); font-size: 32px; font-weight: 700; line-height: 1.1; }
.res-big span { font-size: 12.5px; color: var(--muted); }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 70; background: var(--surface-3); color: var(--text); padding: 12px 16px; border-radius: 16px; font-size: 14px; box-shadow: var(--shadow); display: flex; gap: 10px; align-items: flex-start; max-width: min(520px, calc(100vw - 32px)); animation: rise .35s var(--spring); }
.toast .ri { color: var(--warn); margin-top: 2px; }
@media (orientation: portrait) and (max-width: 760px) { .toast { bottom: calc(86px + env(safe-area-inset-bottom, 0px)); } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

<body>
<div class="app">
  <nav class="rail" aria-label="Traste">
    <a class="rail-brand" href="#afinador" aria-label="Traste">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2.5c-7.4 0-12.5 3.2-12.5 8.6 0 6.6 6.6 14 11 18.1a2.2 2.2 0 0 0 3 0c4.4-4.1 11-11.5 11-18.1C28.5 5.7 23.4 2.5 16 2.5Z" fill="var(--accent)"/><path d="M9.5 11h13M11 15.5h10M13 20h6" stroke="var(--accent-ink)" stroke-width="1.9" stroke-linecap="round" opacity=".5"/></svg>
    </a>
    <a class="rail-item" href="#afinador" data-tab="afinador"><span data-icon="dashboard-3-line"></span>Afinar</a>
    <a class="rail-item" href="#aprender" data-tab="aprender"><span data-icon="graduation-cap-line"></span>Aprender</a>
    <a class="rail-item" href="#canciones" data-tab="canciones"><span data-icon="music-2-line"></span>Canciones</a>
    <div class="rail-end">
      <a class="rail-item" href="#ajustes" data-tab="ajustes"><span data-icon="settings-3-line"></span>Ajustes<i class="rail-dot" id="railMicDot" hidden></i></a>
    </div>
  </nav>

  <main class="views">
    <!-- ======================= AFINADOR ======================= -->
    <section class="view" data-view="afinador" hidden>
      <div class="tuner">
        <div class="t-main">
          <div class="t-top">
            <button type="button" class="mode-chip" id="tnMode"><i></i><span id="tnModeText">Automático</span></button>
            <span class="faint num text-sm" id="tnFreq"></span>
          </div>
          <div class="readout">
            <div class="note-big" id="tnNote">—</div>
            <div class="sub" id="tnSub">Pulsa una cuerda al aire</div>
          </div>
          <div class="gauge" id="gauge" aria-hidden="true">
            <div class="band"></div>
            <div id="ticks"></div>
            <div class="needle" id="needle"></div>
          </div>
          <div class="gauge-scale num"><span>Grave</span><span>−25</span><span>0</span><span>+25</span><span>Aguda</span></div>
          <div class="hint" id="tnHint" aria-live="polite"></div>
        </div>
        <div class="t-strings">
          <div class="t-head">
            <span class="t-prog" id="tnProg"></span>
            <button type="button" class="btn btn-ghost btn-sm" id="tnReset" title="Marcar todas como sin afinar"><span data-icon="restart-line"></span>Reiniciar</button>
          </div>
          <div class="strings" id="tnStrings"></div>
          <div class="mic-card compact" data-mic-card></div>
        </div>
        <div class="overlay-cta" id="tunerCta">
          <div>
            <h3>Necesito oír tu guitarra</h3>
            <p>Activa el micrófono. El sonido se analiza en tu navegador y no sale de tu equipo.</p>
            <button type="button" class="btn btn-primary btn-lg" data-action="mic-on"><span data-icon="mic-line"></span>Activar micrófono</button>
          </div>
        </div>
      </div>
      <div class="cal-host overlay" hidden></div>
    </section>

    <!-- ======================= APRENDER ======================= -->
    <section class="view" data-view="aprender" hidden>
      <div class="learn" id="learn"></div>
      <div class="cal-host overlay" hidden></div>
    </section>

    <!-- ======================= CANCIONES ======================= -->
    <section class="view" data-view="canciones" hidden>
      <div class="list-pane" id="songList">
        <div class="list-top">
          <label class="search"><span data-icon="search-line"></span><input type="search" id="songSearch" placeholder="Buscar canción" aria-label="Buscar canción"></label>
          <div class="filters" id="songFilters"></div>
        </div>
        <div class="song-list scroll" id="songGrid"></div>
      </div>

      <div class="player" id="player" hidden>
        <div class="pl-top">
          <button type="button" class="btn btn-soft btn-icon" id="plBack" aria-label="Volver a las canciones"><span data-icon="arrow-left-line"></span></button>
          <div class="pl-title"><h1 id="plTitle">—</h1><p id="plOrigin"></p></div>
          <div class="hud">
            <div><div class="pts num" id="plScore">0</div><div class="lbl" id="plScoreLbl">puntos</div></div>
            <div class="mult" id="plMult" title="Multiplicador por racha">×1</div>
          </div>
          <div class="pl-btns">
            <button type="button" class="btn btn-soft btn-icon pl-opts-btn" id="plOptsBtn" aria-label="Opciones: nivel y velocidad" aria-expanded="false"><span data-icon="equalizer-2-line"></span></button>
            <button type="button" class="btn btn-soft" id="plDemo"><span data-icon="headphone-line"></span><span>Escuchar</span></button>
            <button type="button" class="btn btn-soft btn-icon" id="plRestart" aria-label="Empezar desde el principio" title="Empezar desde el principio"><span data-icon="restart-line"></span></button>
            <button type="button" class="btn btn-primary btn-icon" id="plPlay" aria-label="Tocar"><span data-icon="play-fill"></span></button>
          </div>
        </div>
        <div class="pl-opts" id="plOpts">
          <div class="seg" id="plLevel" role="group" aria-label="Nivel"></div>
          <div class="speed" role="group" aria-label="Velocidad">
            <input type="range" id="plSpeed" min="0" max="3" step="1" value="1" aria-label="Velocidad" aria-valuetext="Lento">
            <div class="speed-labels" id="plSpeedLabels"></div>
          </div>
          <label class="toggle" title="Modo práctica: la canción se para hasta que tocas la nota (sin puntuación)"><input type="checkbox" id="plWait">Esperarme</label>
          <label class="toggle"><input type="checkbox" id="plMetro">Metrónomo</label>
        </div>
        <div class="cal-card" hidden></div>
        <div class="highway"><canvas id="hw" aria-label="Partitura en movimiento: toca para empezar o pausar, desliza para moverte"></canvas></div>
        <div class="now-strip">
          <div class="min-w-0 flex-1">
            <div id="plNowText" class="now-text"></div>
            <div id="plNext" class="text-sm muted truncate"></div>
          </div>
          <button type="button" class="btn btn-soft btn-sm" id="plFingersBtn" aria-expanded="false" aria-controls="plDetails"><span data-icon="hand"></span>Dedos<span data-icon="arrow-down-s-line" class="chev"></span></button>
        </div>
        <div id="plDetails" class="sheet" hidden>
          <div class="fret-wrap" id="plFret"></div>
          <div class="flex flex-col items-center gap-2" id="plHand"></div>
        </div>
      </div>
    </section>
    <!-- ======================= AJUSTES ======================= -->
    <section class="view" data-view="ajustes" hidden>
      <div class="settings scroll" id="settings"></div>
    </section>
  </main>
</div>

<!-- Resultado de canción -->
<div class="modal" id="resModal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="resTitle">
    <div class="stars mb-3" id="resStars"></div>
    <h2 id="resTitle">¡Bien tocado!</h2>
    <p class="muted mt-1" id="resText"></p>
    <div class="res-big" id="resBig"></div>
    <div class="res-grid" id="resGrid"></div>
    <div class="res-actions" id="resActions"></div>
  </div>
</div>

/* ============================================================
   DSP y teoría musical — funciones puras (se prueban en Node)
   ============================================================ */

// Afinación estándar, de 6ª (Mi grave) a 1ª (Mi agudo), en MIDI
const OPEN_MIDI = [40, 45, 50, 55, 59, 64]; // índice 0 = cuerda 6
const stringMidi = (s) => OPEN_MIDI[6 - s];   // s: 1..6

const LETTERS = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
const LATIN = ['Do', 'Do#', 'Re', 'Re#', 'Mi', 'Fa', 'Fa#', 'Sol', 'Sol#', 'La', 'La#', 'Si'];
const LETTER_TO_PC = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };

const midiToFreq = (m) => 440 * Math.pow(2, (m - 69) / 12);
const freqToMidi = (f) => 69 + 12 * Math.log2(f / 440);

function noteToMidi(name) {
  const m = /^([A-G])([#b]?)(-?\d)$/.exec(name);
  if (!m) throw new Error('Nota no válida: ' + name);
  let pc = LETTER_TO_PC[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
  return 12 * (parseInt(m[3], 10) + 1) + pc;
}

/* ---------- Detección de tono: YIN (de Cheveigné & Kawahara, 2002) ---------- */
function yin(buf, sr, opts = {}) {
  const fmin = opts.fmin || 70, fmax = opts.fmax || 1400, thr = opts.threshold || 0.12;
  const tauMax = Math.min(Math.floor(sr / fmin), Math.floor(buf.length / 2));
  const tauMin = Math.max(2, Math.floor(sr / fmax));
  const W = buf.length - tauMax - 1;
  const d = new Float32Array(tauMax + 2);
  for (let tau = 1; tau <= tauMax + 1; tau++) {
    let s = 0;
    for (let i = 0; i < W; i++) { const x = buf[i] - buf[i + tau]; s += x * x; }
    d[tau] = s;
  }
  const c = new Float32Array(tauMax + 2); c[0] = 1;
  let run = 0;
  for (let tau = 1; tau <= tauMax + 1; tau++) { run += d[tau]; c[tau] = run > 0 ? d[tau] * tau / run : 1; }
  let tau = -1;
  for (let t = tauMin; t <= tauMax; t++) {
    if (c[t] < thr) { while (t + 1 <= tauMax && c[t + 1] < c[t]) t++; tau = t; break; }
  }
  if (tau < 0) {
    let best = tauMin;
    for (let t = tauMin; t <= tauMax; t++) if (c[t] < c[best]) best = t;
    if (c[best] > 0.3) return null;
    tau = best;
  }
  let est = tau;
  if (tau > 1 && tau < tauMax) {
    const s0 = c[tau - 1], s1 = c[tau], s2 = c[tau + 1], den = s0 + s2 - 2 * s1;
    if (den) est = tau + (s0 - s2) / (2 * den);
  }
  return { freq: sr / est, prob: 1 - c[tau] };
}

// Diezma a ~24 kHz con un filtro [1 2 1]/4 para abaratar YIN (la guitarra no pasa de ~1,4 kHz de fundamental)
function decimate(src, factor) {
  if (factor <= 1) return { buf: src, f: 1 };
  const n = Math.floor(src.length / factor), out = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const j = i * factor;
    out[i] = 0.25 * (src[j - 1] ?? src[j]) + 0.5 * src[j] + 0.25 * (src[j + 1] ?? src[j]);
  }
  return { buf: out, f: factor };
}

function rms(buf, from = 0) {
  let s = 0; for (let i = from; i < buf.length; i++) s += buf[i] * buf[i];
  return Math.sqrt(s / Math.max(1, buf.length - from));
}

/* ---------- Energía por semitono (máximo por banda, Stark & Plumbley 2009) ---------- */
// mags: magnitudes lineales del FFT (fftSize/2 valores)
function semitoneEnergies(mags, sr, fftSize, lo, hi) {
  const binHz = sr / fftSize, out = new Float32Array(hi - lo + 1);
  for (let m = lo; m <= hi; m++) {
    const f = midiToFreq(m);
    const a = Math.max(1, Math.ceil(f * 0.9715 / binHz)), b = Math.min(mags.length - 1, Math.floor(f * 1.0293 / binHz));
    let v = 0;
    if (b < a) v = mags[Math.round(f / binHz)] || 0;
    else for (let k = a; k <= b; k++) if (mags[k] > v) v = mags[k];
    out[m - lo] = v;
  }
  return out;
}

/* ---------- Reconocimiento de acordes por plantillas de armónicos ----------
   Como sabemos exactamente qué nota debe dar cada cuerda, comparamos el espectro (por semitonos)
   con la plantilla armónica de varias hipótesis: el acorde correcto, el acorde con una cuerda
   apagada, con una cuerda "X" sonando y el resto de acordes. Gana la que mejor explica el sonido. */
const V_LO = 40, V_HI = 92;
const HARM = [[0, 1], [12, 0.75], [19, 0.55], [24, 0.45], [28, 0.32], [31, 0.28], [34, 0.18], [36, 0.16]];
// Los micrófonos pequeños (móvil, portátil) apenas captan por debajo de ~150 Hz:
// las parciales graves pesan la mitad para no "echar en falta" cuerdas que sí suenan.
function voicingTemplate(midis, lo = V_LO, hi = V_HI) {
  const t = new Float32Array(hi - lo + 1);
  for (const m of midis) for (const [off, w] of HARM) { const k = m + off - lo; if (k >= 0 && k < t.length) t[k] += w * (m + off < 52 ? 0.5 : 1); }
  for (let i = 0; i < t.length; i++) t[i] = Math.sqrt(t[i]);
  return t;
}
// Compresión logarítmica: iguala cuerdas tocadas con distinta fuerza y la coloración del micrófono
function prepSemis(semis) {
  const v = new Float32Array(semis.length); let mx = 0;
  for (let i = 0; i < semis.length; i++) mx = Math.max(mx, semis[i]);
  for (let i = 0; i < semis.length; i++) v[i] = mx > 0 ? Math.log1p(30 * semis[i] / mx) : 0;
  return v;
}
function cosine(a, b) { let d = 0, x = 0, y = 0; for (let i = 0; i < a.length; i++) { d += a[i] * b[i]; x += a[i] * a[i]; y += b[i] * b[i]; } return x && y ? d / Math.sqrt(x * y) : 0; }

// hipótesis para un acorde esperado: [{kind:'ok'|'missing'|'extra'|'other', string?, id?, midis}]
function chordHypotheses(expected, library) {
  const hyps = [{ kind: 'ok', midis: expected.notes.map((n) => n.midi) }];
  if (expected.notes.length > 2) for (const n of expected.notes) {
    const rest = expected.notes.filter((x) => x !== n).map((x) => x.midi);
    hyps.push({ kind: 'missing', string: n.string, midi: n.midi, midis: rest });
  }
  for (let s = 1; s <= 6; s++) {
    if (expected.notes.some((n) => n.string === s) || (expected.dir === 'U' && s >= 5)) continue;
    hyps.push({ kind: 'extra', string: s, midi: stringMidi(s), midis: [...hyps[0].midis, stringMidi(s)] });
  }
  for (const [id, notes] of library) {
    const ms = notes.map((n) => n.midi);
    if (ms.slice().sort().join() === hyps[0].midis.slice().sort().join()) continue;
    hyps.push({ kind: 'other', id, midis: ms });
  }
  return hyps.map((h) => ({ ...h, tpl: voicingTemplate(h.midis) }));
}

// ok: el acorde esperado explica el sonido (o casi tan bien como la mejor hipótesis).
// confident: solo entonces se da un diagnóstico concreto; si no, se dice que no se ha oído claro.
function matchChord(semis, hyps, margin = 0.02) {
  const v = prepSemis(semis);
  let best = null, other = 0;
  const okScore = cosine(v, hyps[0].tpl);
  for (const h of hyps) {
    const s = cosine(v, h.tpl);
    if (h.kind === 'other' && s > other) other = s;
    if (!best || s > best.score) best = { ...h, score: s };
  }
  // una cuerda de más o de menos del mismo acorde se tolera (margin); otro acorde (p. ej. Mi frente
  // a Mi7, que se separan por una sola nota) nunca puede explicar el sonido mejor que el esperado
  const ok = okScore >= 0.6 && other - okScore < 0.006 && (best.kind === 'ok' || best.score - okScore < margin);
  const need = best.kind === 'missing' && best.string >= 5 ? 0.05 : 0.02;
  const confident = !ok && okScore >= 0.5 && best.kind !== 'ok' && best.score - okScore >= need;
  return { ok, score: okScore, best, confident };
}

// Nota nueva a partir de lo que "aparece" en el espectro tras un ataque (después − antes).
// Funciona aunque la cuerda anterior siga sonando, que es donde el detector de nota única duda.
const NOTE_TPL = [];
function newNote(flux, minScore = 0.55) {
  let mx = 0; for (const x of flux) if (x > mx) mx = x;
  if (mx <= 0) return null;
  const v = new Float32Array(flux.length);
  for (let i = 0; i < flux.length; i++) v[i] = Math.log1p(30 * flux[i] / mx);
  let best = null, bs = 0;
  for (let m = 40; m <= 77; m++) {
    const t = NOTE_TPL[m] || (NOTE_TPL[m] = voicingTemplate([m]));
    const s = cosine(v, t); if (s > bs) { bs = s; best = m; }
  }
  return bs >= minScore ? best : null;
}

/* ---------- Rasgueo en canciones (validado con grabaciones reales de GuitarSet) ----------
   Con audio real, exigir el acorde exacto solo acepta ~45 % de los rasgueos bien tocados, así que
   en canciones se usa una regla tolerante: vale salvo que otro acorde o "pocas cuerdas" expliquen
   mejor el sonido, varias notas del acorde tengan huella propia y lo que aparece en el ataque no sea
   una sola nota. Resultado con GuitarSet: 82 % de rasgueos correctos aceptados, 9 % de notas sueltas. */
function fewHypotheses(notes) {
  const ms = [...new Set(notes.map((n) => n.midi))], out = [];
  for (let i = 0; i < ms.length; i++) { out.push([ms[i]]); for (let j = i + 1; j < ms.length; j++) out.push([ms[i], ms[j]]); }
  return out.map((m) => ({ kind: 'few', midis: m, tpl: voicingTemplate(m) }));
}
function notePresence(semis, notes, thr = 0.45) {
  const v = prepSemis(semis); let mx = 0; for (const x of v) mx = Math.max(mx, x);
  const ms = [...new Set(notes.map((n) => n.midi))]; let p = 0;
  for (const m of ms) { const a = v[m - V_LO] || 0, b = (v[m + 12 - V_LO] || 0) * 0.85; if (Math.max(a, b) >= thr * mx) p++; }
  return { present: p, total: ms.length };
}
// parecido de lo que aparece en el ataque a una sola nota (1 = una nota clara)
function singleNoteLikeness(flux) {
  let mx = 0; for (const x of flux) mx = Math.max(mx, x);
  if (!mx) return 1;
  const v = new Float32Array(flux.length); for (let i = 0; i < flux.length; i++) v[i] = Math.log1p(30 * flux[i] / mx);
  let b = 0; for (let m = 40; m <= 77; m++) { const t = NOTE_TPL[m] || (NOTE_TPL[m] = voicingTemplate([m])); b = Math.max(b, cosine(v, t)); }
  return b;
}
function strumOk(semis, hyps, few, notes) {
  const v = prepSemis(semis), ok = cosine(v, hyps[0].tpl);
  let other = 0; for (const h of hyps) if (h.kind === 'other') other = Math.max(other, cosine(v, h.tpl));
  let fw = 0; for (const h of few) fw = Math.max(fw, cosine(v, h.tpl));
  if (ok < 0.5 || other - ok >= 0.03 || fw - ok >= 0.02) return false;
  const { present, total } = notePresence(semis, notes);
  return present >= Math.min(3, total) && present / total >= 0.6;
}

/* ---------- Síntesis de cuerda pulsada: Karplus-Strong con afinación fraccional ---------- */
function ksRender(freq, sr, dur = 2.4, opts = {}) {
  const n = Math.floor(sr * dur), out = new Float32Array(n);
  const D = sr / freq;
  let N = Math.floor(D - 0.5), frac = D - 0.5 - N;
  if (frac < 0.1) { N -= 1; frac += 1; }
  const C = (1 - frac) / (1 + frac); // paso-todo para el retardo fraccional
  const line = new Float32Array(N);
  const bright = opts.bright ?? 0.55;
  let p = 0, mean = 0;
  for (let i = 0; i < N; i++) { p += bright * ((Math.random() * 2 - 1) - p); line[i] = p; mean += p; }
  mean /= N; for (let i = 0; i < N; i++) line[i] -= mean;
  const t60 = opts.t60 ?? (freq < 150 ? 3.2 : freq < 300 ? 2.4 : 1.7);
  const g = Math.pow(10, -3 / (t60 * freq)); // pérdida por periodo
  let idx = 0, prev = 0, apx = 0, apy = 0;
  for (let i = 0; i < n; i++) {
    const x = line[idx];
    const avg = 0.5 * (x + prev); prev = x;
    const y = C * avg + apx - C * apy; apx = avg; apy = y;
    line[idx] = y * g;
    out[i] = x;
    idx = idx + 1 === N ? 0 : idx + 1;
  }
  const fade = Math.floor(sr * 0.06);
  for (let i = 0; i < fade; i++) out[n - 1 - i] *= i / fade;
  let peak = 0; for (let i = 0; i < n; i++) peak = Math.max(peak, Math.abs(out[i]));
  if (peak > 0) for (let i = 0; i < n; i++) out[i] *= 0.9 / peak;
  return out;
}

/* ---------- Partituras: melodías, acordes y niveles ---------- */
// "G3 A3:0.5 R:1 | ..." → [{midi|null, beats}]
function parseMelody(str) {
  return str.split(/\s+/).filter((t) => t && t !== '|').map((tok) => {
    const [n, b] = tok.split(':');
    return { midi: n === 'R' ? null : noteToMidi(n), beats: b ? parseFloat(b) : 1 };
  });
}

// Posición abierta (1ª posición): la cuerda con el traste más bajo; dedo = traste (1 dedo por traste)
function firstPosition(midi) {
  let best = null;
  for (let s = 1; s <= 6; s++) {
    const fret = midi - stringMidi(s);
    if (fret < 0 || fret > 5) continue;
    if (!best || fret < best.fret) best = { string: s, fret };
  }
  if (!best) return null;
  best.finger = best.fret === 0 ? 0 : Math.min(4, best.fret);
  best.midi = midi;
  return best;
}

// "G | C G | D:3 G:1" → [{chord, t, dur}]
function parseChordBars(str, bpb, start) {
  const out = []; let t = start;
  for (const bar of str.split('|')) {
    const toks = bar.trim().split(/\s+/).filter(Boolean);
    if (!toks.length) continue;
    const explicit = toks.some((x) => x.includes(':'));
    for (const tok of toks) {
      const [name, b] = tok.split(':');
      const dur = explicit ? parseFloat(b || '0') : bpb / toks.length;
      out.push({ chord: name, t, dur }); t += dur;
    }
  }
  return out;
}

const STRUM_PATTERNS = {
  4: [[0, 'D'], [1, 'D'], [1.5, 'U'], [2.5, 'U'], [3, 'D'], [3.5, 'U']],
  3: [[0, 'D'], [1, 'D'], [1.5, 'U'], [2, 'D'], [2.5, 'U']],
};

function chordNotes(chord, dir = 'D') {
  const notes = [];
  chord.frets.forEach((f, i) => {
    if (f < 0) return;
    const s = 6 - i;
    notes.push({ string: s, fret: f, finger: chord.fingers[i] || 0, midi: OPEN_MIDI[i] + f });
  });
  // en el rasgueo hacia arriba se tocan sobre todo las cuerdas agudas
  return dir === 'U' ? notes.filter((n) => n.string <= 4) : notes;
}

function buildSong(song, chords) {
  const melody = parseMelody(song.melody);
  const melodyEvents = []; let t = 0;
  for (const n of melody) {
    if (n.midi !== null) {
      const pos = firstPosition(n.midi);
      if (!pos) throw new Error(`${song.id}: nota fuera de posición ${n.midi}`);
      melodyEvents.push({ t, dur: n.beats, notes: [pos] });
    }
    t += n.beats;
  }
  const total = t;
  const pickup = song.pickup || 0;
  const chordTrack = parseChordBars(song.chords, song.bpb, pickup);
  const pattern = song.strum === 'bar' ? [[0, 'D']] : STRUM_PATTERNS[song.bpb] || STRUM_PATTERNS[4];
  const hard = [];
  for (const seg of chordTrack) {
    const ch = chords[seg.chord];
    if (!ch) throw new Error(`${song.id}: acorde desconocido ${seg.chord}`);
    const barStart = pickup + Math.floor((seg.t - pickup) / song.bpb + 1e-6) * song.bpb;
    for (const [off, dir] of pattern) {
      const at = barStart + off;
      if (at < seg.t - 1e-6 || at >= seg.t + seg.dur - 1e-6) continue;
      hard.push({ t: at, dur: 0.5, chord: seg.chord, dir, notes: chordNotes(ch, dir), first: Math.abs(at - seg.t) < 1e-6 });
    }
  }
  hard.forEach((e, i) => { e.dur = Math.min(1, (hard[i + 1]?.t ?? total) - e.t); });
  return { total, pickup, chordTrack, levels: { easy: melodyEvents, hard } };
}

if (typeof module !== 'undefined') module.exports = {
  OPEN_MIDI, stringMidi, LETTERS, LATIN, midiToFreq, freqToMidi, noteToMidi, yin, decimate, rms,
  semitoneEnergies, ksRender, parseMelody, firstPosition, parseChordBars,
  chordNotes, voicingTemplate, chordHypotheses, matchChord, newNote, fewHypotheses, notePresence, singleNoteLikeness, strumOk, V_LO, V_HI, buildSong, STRUM_PATTERNS,
};

    Mic.ignoreFor((when + 2.5) * 1000); // que la app no se escuche a sí misma
  },
  strum(notes, dir = 'D', when = 0) {
    const order = [...notes].sort((a, b) => (dir === 'D' ? b.string - a.string : a.string - b.string));
    order.forEach((n, i) => this.pluck(midiToFreq(n.midi), when + i * (dir === 'D' ? 0.016 : 0.012), dir === 'D' ? 0.3 : 0.22));
  },
  click(accent) {
    const ctx = this.ensure(), o = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime;
    o.frequency.value = accent ? 2600 : 2100; // por encima del registro de la guitarra
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(accent ? 0.35 : 0.2, t + 0.002); g.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
    o.connect(g).connect(this.out); o.start(t); o.stop(t + 0.06);

  },

  // periodo y el detector mide la nota exacta (probado con altavoces que cortan por debajo de 700 Hz).
