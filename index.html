/* Traste · app de pantalla completa
   Estructura: una barra de navegación (lateral; abajo en móvil vertical) y una vista que ocupa
   exactamente el resto de la pantalla. Nada de cabeceras ni títulos de sección: cada vista tiene un
   protagonista (cuerdas, diagrama, partitura) y los controles justos a su alrededor.
   Color: coral = acción, menta = bien, ámbar = casi, rojo = mal. Los cuatro colores de dedo solo
   significan dedos. */
:root {
  color-scheme: dark;
  --bg: #100e17;
  --bg-2: #0b0a11;
  --surface: #17141f;
  --surface-2: #201c2a;
  --surface-3: #2b2637;
  --line: #262132;
  --line-2: #383146;
  --text: #f4efe6;
  --muted: #a39dae;
  --faint: #6e6779;
  --accent: #ff6a3d;
  --accent-strong: #ff875f;
  --accent-ink: #1d0b05;
  --accent-soft: rgba(255, 106, 61, 0.14);
  --ok: #34d399;
  --ok-soft: rgba(52, 211, 153, 0.15);
  --warn: #ffb020;
  --bad: #ff4d6d;
  --f1: #4c8dff;
  --f2: #9b6bff;
  --f3: #ff5fa2;
  --f4: #ffc23d;
  --open: #f4efe6;
  --dot-ink: #120f19;
  --shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
  --font: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --display: 'Bricolage Grotesque', 'Inter', ui-sans-serif, system-ui, sans-serif;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --spring: cubic-bezier(.34, 1.56, .64, 1);
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg: #f6f4f1; --bg-2: #ece8f2; --surface: #ffffff; --surface-2: #f0edf5; --surface-3: #e4dfec;
    --line: #e6e1ec; --line-2: #d3ccdd; --text: #18141f; --muted: #5f5869; --faint: #958ea0;
    --accent: #ee5226; --accent-strong: #ff6a3d; --accent-ink: #ffffff; --accent-soft: rgba(238, 82, 38, 0.11);
    --ok: #0f9f6e; --ok-soft: rgba(15, 159, 110, 0.12); --warn: #c77d00; --bad: #e0304f;
    --f1: #2f74f0; --f2: #7c4df0; --f3: #e8408a; --f4: #e8a300; --open: #18141f; --dot-ink: #ffffff;
    --shadow: 0 20px 50px rgba(40, 20, 60, 0.16);
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f6f4f1; --bg-2: #ece8f2; --surface: #ffffff; --surface-2: #f0edf5; --surface-3: #e4dfec;
  --line: #e6e1ec; --line-2: #d3ccdd; --text: #18141f; --muted: #5f5869; --faint: #958ea0;
  --accent: #ee5226; --accent-strong: #ff6a3d; --accent-ink: #ffffff; --accent-soft: rgba(238, 82, 38, 0.11);
  --ok: #0f9f6e; --ok-soft: rgba(15, 159, 110, 0.12); --warn: #c77d00; --bad: #e0304f;
  --f1: #2f74f0; --f2: #7c4df0; --f3: #e8408a; --f4: #e8a300; --open: #18141f; --dot-ink: #ffffff;
  --shadow: 0 20px 50px rgba(40, 20, 60, 0.16);
}

[hidden] { display: none !important; }
html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
body { color: var(--text); background: var(--bg); font-family: var(--font); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; letter-spacing: -0.025em; }
::selection { background: var(--accent-soft); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 10px; }
.ri { width: 1.15em; height: 1.15em; flex: none; display: inline-block; vertical-align: -0.2em; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }

/* ---------- Estructura de la app ---------- */
.app { display: flex; height: 100%; padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.views { position: relative; flex: 1; min-width: 0; min-height: 0; }
.view { position: absolute; inset: 0; display: flex; flex-direction: column; min-height: 0; padding: 18px 22px; }
.scroll { overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; min-height: 0; }

/* Barra de navegación: lateral por defecto, abajo en móvil vertical */
.rail { flex: none; width: 84px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 14px 6px; background: var(--bg-2); border-right: 1px solid var(--line); z-index: 30; }
.rail-brand { display: grid; place-items: center; width: 44px; height: 44px; margin-bottom: 12px; }
.rail-brand svg { width: 30px; height: 30px; }
.rail-item { position: relative; width: 70px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 0 8px; border-radius: 16px; border: 0; background: transparent; color: var(--faint); font: 600 11.5px/1.1 var(--font); text-decoration: none; cursor: pointer; transition: color .2s, background .2s; }
.rail-item .ri { width: 23px; height: 23px; }
.rail-item:hover { color: var(--text); }
.rail-item[aria-current="page"] { color: var(--text); background: var(--surface-2); }
.rail-item[aria-current="page"] .ri { color: var(--accent); }
.rail-end { margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.rail-item .key { font-family: var(--display); font-size: 17px; font-weight: 800; line-height: 23px; color: var(--text); }
.rail-item.mic[data-on="true"] { color: var(--text); }
.rail-item.mic[data-on="true"] .ri { color: var(--ok); }
.meter { display: flex; gap: 2px; align-items: flex-end; height: 10px; }
.meter i { width: 3px; border-radius: 2px; background: var(--line-2); transition: background .08s; }
.meter i:nth-child(1) { height: 3px } .meter i:nth-child(2) { height: 5px } .meter i:nth-child(3) { height: 7px } .meter i:nth-child(4) { height: 9px } .meter i:nth-child(5) { height: 10px }
.meter i.lit { background: var(--ok); }
.meter i.lit.hot { background: var(--warn); }

@media (orientation: portrait) and (max-width: 760px) {
  .app { flex-direction: column; }
  .views { order: 1; }
  .rail { order: 2; width: auto; flex-direction: row; justify-content: space-around; align-items: stretch; gap: 0; padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px)); border-right: 0; border-top: 1px solid var(--line); }
  .rail-brand { display: none; }
  .rail-end { margin: 0; flex-direction: row; display: contents; }
  .rail-item { flex: 1; width: auto; padding: 8px 0 6px; }
  .view { padding: 14px 16px; }
}
@media (max-height: 520px) {
  .rail { padding: 8px 6px; gap: 2px; }
  .rail-brand { display: none; }
  .rail-item { padding: 6px 0; gap: 3px; }
  .rail-item .ri { width: 20px; height: 20px; }
  .view { padding: 10px 16px; }
}

/* ---------- Botones y controles ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 42px; padding: 0 18px; border-radius: 999px; font: 600 14.5px/1 var(--font); border: 0; cursor: pointer; transition: background .2s var(--ease), color .2s, transform .15s var(--ease); white-space: nowrap; user-select: none; color: var(--text); background: transparent; flex: none; }
.btn:active { transform: scale(.96); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { background: var(--accent-strong); }
.btn-soft { background: var(--surface-2); }
.btn-soft:hover { background: var(--surface-3); }
.btn-ghost { color: var(--muted); }
.btn-ghost:hover { color: var(--text); background: var(--surface-2); }
.btn-lg { height: 50px; padding: 0 24px; font-size: 15.5px; }
.btn-sm { height: 36px; padding: 0 14px; font-size: 13.5px; }
.btn-icon { width: 42px; padding: 0; }
.btn-lg.btn-icon { width: 50px; }
.btn-sm.btn-icon { width: 36px; }
.seg { display: inline-flex; padding: 4px; background: var(--surface-2); border-radius: 999px; gap: 2px; flex: none; }
.seg button { height: 32px; padding: 0 14px; border-radius: 999px; font: 600 13.5px/1 var(--font); color: var(--muted); background: transparent; border: 0; cursor: pointer; transition: all .2s var(--ease); white-space: nowrap; }
.seg button:hover { color: var(--text); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 2px 8px rgba(0, 0, 0, .2); }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border-radius: 999px; font: 600 13.5px/1 var(--font); color: var(--muted); background: var(--surface-2); border: 0; cursor: pointer; transition: all .2s; white-space: nowrap; flex: none; }
.chip:hover { color: var(--text); }
.chip:disabled { opacity: .4; cursor: not-allowed; }
.chip[aria-pressed="true"] { background: var(--text); color: var(--bg); }
.toggle { display: inline-flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); cursor: pointer; user-select: none; }
.toggle input { appearance: none; width: 36px; height: 22px; border-radius: 22px; background: var(--surface-3); position: relative; cursor: pointer; transition: background .2s; flex: none; margin: 0; }
.toggle input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--muted); transition: transform .25s var(--spring), background .2s; }
.toggle input:checked { background: var(--accent-soft); }
.toggle input:checked::after { transform: translateX(14px); background: var(--accent); }
.toggle:hover { color: var(--text); }
input[type="range"] { appearance: none; height: 4px; border-radius: 4px; background: var(--surface-3); outline-offset: 6px; }
input[type="range"]::-webkit-slider-thumb { appearance: none; width: 18px; height: 18px; border-radius: 50%; background: var(--text); border: 4px solid var(--surface); box-shadow: 0 0 0 1px var(--line-2); cursor: pointer; }
input[type="range"]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--text); border: 4px solid var(--surface); cursor: pointer; }
select, input[type="search"] { background: var(--surface-2); border: 0; color: var(--text); border-radius: 12px; font: 14px/1.4 var(--font); }
select { height: 36px; padding: 0 10px; max-width: 220px; }
.link-btn { background: none; border: 0; padding: 0; color: var(--muted); font: 500 13.5px/1.4 var(--font); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.link-btn:hover { color: var(--text); }
.tip { display: flex; gap: 10px; font-size: 14px; color: var(--muted); }
.tip .ri { color: var(--accent); margin-top: 2px; }
.dots { display: inline-flex; gap: 3px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--surface-3); }
.dots i.on { background: var(--accent); }
.overlay-cta { position: absolute; inset: 0; z-index: 6; display: grid; place-items: center; text-align: center; padding: 24px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); }
.overlay-cta h3 { font-size: 26px; }
.overlay-cta p { color: var(--muted); max-width: 36ch; margin: 8px auto 20px; }

/* ---------- Comprobación del micrófono ---------- */
.cal-host.overlay { position: absolute; inset: 0; z-index: 7; background: var(--bg); display: grid; place-items: center; padding: 20px; overflow: auto; }
.cal-card { flex: 1; min-height: 0; overflow: auto; display: grid; place-items: center; padding: 20px; }
.cal-card:not([hidden]) ~ .highway, .cal-card:not([hidden]) ~ .now-strip { display: none; }
.cal { width: min(420px, 100%); display: flex; flex-direction: column; gap: 14px; }
.cal h3 { font-size: 24px; }
.cal-list { display: flex; flex-direction: column; gap: 10px; }
.cal-item { display: grid; grid-template-columns: 28px 1fr; gap: 12px; align-items: start; font-size: 14px; }
.cal-item .st { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); color: var(--muted); font-weight: 700; font-size: 12.5px; }
.cal-item .st .ri { width: 16px; height: 16px; }
.cal-item b { font-weight: 600; display: block; }
.cal-item p { color: var(--muted); font-size: 13.5px; }
.cal-item[data-s="run"] .st { background: var(--accent-soft); color: var(--accent); animation: pulse 1.4s infinite; }
.cal-item[data-s="ok"] .st { background: var(--ok); color: var(--dot-ink); }
.cal-item[data-s="warn"] .st { background: var(--warn); color: var(--dot-ink); }
.cal-item .res { font-size: 13.5px; margin-top: 3px; }
.vol-note { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-radius: 16px; background: var(--accent-soft); color: var(--accent); font-size: 14px; font-weight: 600; }
.vol-note .ri { width: 20px; height: 20px; }
.bar { height: 5px; border-radius: 5px; background: var(--surface-3); overflow: hidden; }
.bar > div { height: 100%; width: 0; background: var(--ok); border-radius: 5px; transition: width .08s linear; }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 var(--accent-soft); } 50% { box-shadow: 0 0 0 9px transparent; } }

/* ---------- Afinador ---------- */
.tuner { position: relative; flex: 1; min-height: 0; display: grid; grid-template-rows: auto minmax(0, max-content); align-content: center; gap: clamp(10px, 3vh, 36px); width: 100%; max-width: 980px; margin: 0 auto; }
.t-main { display: flex; flex-direction: column; justify-content: center; min-height: 0; }
.t-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.mode-chip { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 999px; border: 0; background: var(--surface-2); color: var(--text); font: 600 13.5px/1 var(--font); cursor: pointer; }
.mode-chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 4px var(--ok-soft); }
.mode-chip.manual i { background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.mode-chip .ri { width: 16px; height: 16px; color: var(--muted); }
.readout { text-align: center; margin: 6px 0 2px; }
.note-big { font-family: var(--display); font-size: clamp(64px, 13vh, 132px); font-weight: 700; line-height: 1; letter-spacing: -0.05em; transition: color .25s, transform .3s var(--spring); }
.note-big.pop { transform: scale(1.06); }
.note-big small { font-size: .26em; font-weight: 600; color: var(--muted); letter-spacing: 0; margin-left: 6px; }
.readout .sub { color: var(--muted); margin-top: 6px; min-height: 21px; font-size: 14px; }
.gauge { position: relative; height: clamp(54px, 9vh, 84px); margin: 6px 6px 2px; }
.gauge .band { position: absolute; top: 4px; bottom: 4px; left: 45%; width: 10%; border-radius: 14px; background: var(--ok-soft); transition: background .25s, box-shadow .25s; }
.gauge.in .band { background: color-mix(in srgb, var(--ok) 30%, transparent); box-shadow: 0 0 40px color-mix(in srgb, var(--ok) 45%, transparent); }
.gauge .tick { position: absolute; top: 50%; width: 2px; height: 26%; margin-left: -1px; transform: translateY(-50%); background: var(--line-2); border-radius: 2px; }
.gauge .tick.major { height: 52%; background: var(--faint); }
.gauge .tick.zero { height: 84%; background: color-mix(in srgb, var(--ok) 70%, var(--line-2)); }
.gauge .needle { position: absolute; top: 0; bottom: 0; left: 50%; width: 4px; margin-left: -2px; border-radius: 4px; background: var(--text); box-shadow: 0 0 18px color-mix(in srgb, var(--text) 50%, transparent); opacity: .2; transition: opacity .3s, background .2s; }
.gauge.live .needle { opacity: 1; }
.gauge.in .needle { background: var(--ok); box-shadow: 0 0 22px var(--ok); }
.gauge-scale { display: flex; justify-content: space-between; color: var(--faint); font-size: 12px; padding: 0 2px; }
.hint { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 34px; margin-top: 6px; font-size: 17px; font-weight: 650; }
.hint .ri { width: 22px; height: 22px; }
.t-strings { display: flex; flex-direction: column; min-height: 0; gap: 8px; }
.strings { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 2px; }
.str { flex: 0 1 54px; height: 54px; min-height: 32px; display: grid; grid-template-columns: 50px 1fr 52px; align-items: center; gap: 12px; padding: 0 6px; border-radius: 16px; cursor: pointer; border: 0; background: transparent; color: inherit; font: inherit; text-align: left; transition: background .2s; }
.str:hover { background: var(--surface); }
.str .peg { width: auto; height: min(40px, calc(100% - 4px)); aspect-ratio: 1; justify-self: center; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); font-family: var(--display); font-weight: 700; font-size: 14.5px; transition: all .3s var(--spring); }
.str .wire { position: relative; height: 24px; }
.str .wire svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.str .wire path { stroke: var(--faint); opacity: .7; }
.str .info { font-size: 12.5px; color: var(--faint); text-align: right; font-variant-numeric: tabular-nums; }
.str.sel { background: var(--surface); }
.str.sel .peg { background: var(--accent); color: var(--accent-ink); }
.str.active .wire path { opacity: 1; }
.str.active .peg { transform: scale(1.08); box-shadow: 0 0 0 5px var(--surface-3); }
.str.done .peg { background: var(--ok); color: var(--dot-ink); }
.str.done .info { color: var(--ok); }
.t-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 16px; font-size: 13.5px; padding: 0 6px; }
/* horizontal / pantallas anchas: dos columnas */
@media (min-aspect-ratio: 5/4) {
  .tuner { grid-template-rows: minmax(0, 1fr); grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 40px; align-items: stretch; align-content: stretch; }
  .note-big { font-size: clamp(56px, 19vh, 150px); }
  .gauge { height: clamp(50px, 12vh, 96px); }
}
@media (max-height: 520px) {
  .readout .sub { margin-top: 2px; }
  .hint { font-size: 15px; min-height: 28px; margin-top: 2px; }
  .str .peg { height: min(34px, calc(100% - 4px)); font-size: 13px; }
  .str { grid-template-columns: 42px 1fr 46px; gap: 8px; }
}

/* ---------- Acordes ---------- */
.lesson-path { flex: none; display: flex; gap: 2px; overflow-x: auto; padding: 0 0 10px; scrollbar-width: none; scroll-snap-type: x proximity; mask-image: linear-gradient(90deg, #000 90%, transparent); }
.lesson-path::-webkit-scrollbar { display: none; }
.lesson-path button { position: relative; flex: none; display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 13px; border-radius: 999px; background: transparent; border: 0; color: var(--muted); font: 650 14.5px/1 var(--font); cursor: pointer; scroll-snap-align: start; transition: all .2s; white-space: nowrap; }
.lesson-path button:hover { color: var(--text); background: var(--surface-2); }
.lesson-path button.learned { color: var(--text); }
.lesson-path button.learned::after { content: ""; position: absolute; left: 50%; bottom: 3px; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: var(--ok); }
.lesson-path button[aria-current="true"] { background: var(--text); color: var(--bg); }
.lesson-path button[aria-current="true"]::after { display: none; }
.lesson-path .sep { flex: none; width: 1px; background: var(--line-2); margin: 8px 6px; }
.lesson-body { flex: 1; min-height: 0; }
.lesson { display: grid; gap: 18px 36px; grid-template-columns: minmax(0, 1fr); align-content: start; max-width: 1040px; margin: 0 auto; padding-bottom: 8px; }
.lesson-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.chord-name { font-family: var(--display); font-size: clamp(48px, 8vh, 80px); font-weight: 700; line-height: .95; letter-spacing: -0.05em; }
.chord-name small { display: block; font-family: var(--font); font-size: 14.5px; color: var(--muted); font-weight: 500; letter-spacing: 0; margin-top: 8px; }
.diagram { display: grid; place-items: center; background: var(--bg-2); border-radius: 22px; padding: 14px 10px 8px; min-height: 0; }
.diagram svg { max-height: 30vh; width: auto; }
.lesson-info { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.steps-list { display: flex; flex-direction: column; gap: 12px; list-style: none; padding: 0; margin: 0; }
.steps-list li { display: grid; grid-template-columns: 32px 1fr; gap: 14px; align-items: center; font-size: 15px; line-height: 1.35; }
.steps-list li b { font-weight: 650; }
.fdot { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-weight: 750; font-size: 14px; color: var(--dot-ink); }
.fdot.strum { background: var(--surface-3); color: var(--text); }
.fdot.mute { background: transparent; box-shadow: inset 0 0 0 1.5px var(--line-2); color: var(--muted); }
.fdot .ri { width: 17px; height: 17px; }
.lesson-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.lesson-foot { position: sticky; bottom: 0; z-index: 2; padding: 14px 0 2px; margin-top: -4px; background: linear-gradient(to bottom, transparent, var(--bg) 14px); }
.panel { padding: 16px; border-radius: 22px; background: var(--surface); }
.check-strings { display: flex; gap: 6px; flex-wrap: wrap; }
.cs { width: 44px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; color: var(--faint); font-weight: 600; }
.cs b { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); color: var(--muted); font-family: var(--display); font-size: 13.5px; transition: all .3s var(--spring); }
.cs.skip b { background: transparent; box-shadow: inset 0 0 0 1.5px var(--line); color: var(--faint); }
.cs.now b { background: var(--accent); color: var(--accent-ink); transform: scale(1.12); animation: pulse 1.4s infinite; }
.cs.ok b { background: var(--ok); color: var(--dot-ink); }
.cs.bad b { background: var(--bad); color: #fff; }
.check-msg { margin-top: 12px; font-size: 15.5px; font-weight: 650; min-height: 22px; }
.check-msg p { font-weight: 400; color: var(--muted); font-size: 14px; }
.drill-count { font-family: var(--display); font-size: 46px; font-weight: 700; line-height: 1; letter-spacing: -0.03em; }
@media (min-aspect-ratio: 5/4) {
  .lesson { grid-template-columns: auto minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  .lesson .lesson-head { grid-column: 2; }
  .lesson .diagram { grid-row: 1 / span 2; grid-column: 1; align-self: start; }
  .lesson .lesson-info { grid-column: 2; }
  .diagram svg { max-height: calc(100vh - 150px); }
}
@media (min-aspect-ratio: 5/4) and (min-height: 640px) {
  .lesson { min-height: 100%; align-content: center; grid-template-rows: auto auto; }
  .lesson .diagram { padding: 26px 22px 16px; }
  .lesson .diagram svg { width: clamp(220px, 26vw, 330px); height: auto; max-height: calc(100vh - 170px); }
}
@media (max-height: 520px), (orientation: portrait) and (max-height: 760px) {
  .chord-name { font-size: 44px; }
  .chord-name small { margin-top: 6px; }
  .steps-list { gap: 7px; }
  .steps-list li { font-size: 14px; grid-template-columns: 28px 1fr; gap: 12px; }
  .fdot { width: 28px; height: 28px; font-size: 13px; }
  .lesson .tip { display: none; }
}
.guide-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); align-items: start; max-width: 1100px; margin: 0 auto; }
.guide-card { padding: 20px; display: flex; flex-direction: column; gap: 10px; background: var(--surface); border-radius: 22px; }
.guide-card h3 { font-size: 18px; display: flex; gap: 10px; align-items: baseline; }
.guide-card h3 .n { font-size: 15px; color: var(--accent); }
.guide-card p { color: var(--muted); font-size: 14.5px; }
.guide-card p b { color: var(--text); font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 50%; }

/* ---------- Canciones: catálogo ---------- */
.list-pane { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; }
.list-top { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.search { position: relative; flex: 1 1 240px; max-width: 420px; }
.search .ri { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--faint); }
.search input { width: 100%; height: 42px; padding: 0 16px 0 42px; border-radius: 999px; font-size: 15px; }
.filters { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; flex: 1 1 auto; min-width: 0; }
.filters::-webkit-scrollbar { display: none; }
.song-list { flex: 1; display: grid; gap: 2px 20px; align-content: start; }
@media (min-width: 900px) { .song-list { grid-template-columns: 1fr 1fr; } }
.song-row { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 10px 12px 10px 10px; border-radius: 18px; cursor: pointer; transition: background .2s; }
.song-row:hover { background: var(--surface); }
.song-row .art { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 19px; color: var(--text); background: var(--surface-2); transition: background .2s, color .2s; }
.song-row:hover .art { background: var(--accent); color: var(--accent-ink); }
.song-row h3 { font-family: var(--font); font-size: 15.5px; font-weight: 650; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.song-row .meta { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.song-row .best { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; font-size: 11.5px; color: var(--faint); }
.mini-stars { display: inline-flex; gap: 1px; color: var(--surface-3); }
.mini-stars .ri { width: 13px; height: 13px; }
.mini-stars .on { color: var(--accent); }
.empty { padding: 40px 0; text-align: center; color: var(--muted); }

/* ---------- Canciones: reproductor (llena la pantalla) ---------- */
.player { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
.pl-top { flex: none; display: flex; align-items: center; gap: 10px; }
.pl-title { min-width: 0; flex: 1; }
.pl-title h1 { font-size: 22px; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pl-title p { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hud { display: flex; gap: 10px; align-items: center; flex: none; }
.hud .pts { font-family: var(--display); font-size: 24px; font-weight: 700; letter-spacing: -0.02em; line-height: 1; text-align: right; }
.hud .lbl { font-size: 11.5px; color: var(--muted); text-align: right; }
.mult { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 50%; font-family: var(--display); font-weight: 800; font-size: 15px; background: var(--surface-2); color: var(--muted); transition: transform .3s var(--spring), background .3s, color .3s; }
.mult.m2 { background: var(--f1); color: #fff; } .mult.m3 { background: var(--f2); color: #fff; } .mult.m4 { background: var(--accent); color: var(--accent-ink); }
.mult.bump { transform: scale(1.25); }
.pl-btns { display: flex; gap: 6px; flex: none; }
.pl-opts { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; }
.pl-opts-btn { display: none; }
.speed { display: flex; flex-direction: column; gap: 6px; width: 260px; padding-top: 4px; }
.speed input { width: 100%; }
.speed-labels { position: relative; height: 16px; font-size: 12px; color: var(--faint); font-weight: 600; }
.speed-labels span { position: absolute; top: 0; transform: translateX(-50%); white-space: nowrap; cursor: pointer; }
.speed-labels span:first-child { transform: none; left: 0 !important; }
.speed-labels span:last-child { transform: translateX(-100%); }
.speed-labels span.normal { color: var(--warn); }
.speed-labels span.on { color: var(--text); }
.speed-labels span.normal.on { color: var(--warn); text-decoration: underline; text-underline-offset: 4px; }
.highway { flex: 1; min-height: 120px; background: var(--bg-2); border-radius: 22px; overflow: hidden; }
.highway canvas { display: block; width: 100%; height: 100%; touch-action: pan-y; cursor: grab; user-select: none; -webkit-user-select: none; }
.highway canvas:active { cursor: grabbing; }
.now-strip { flex: none; display: flex; align-items: center; gap: 12px; padding: 2px 4px; }
.now-text { font-size: 15.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.now-text b { font-weight: 700; }
.now-text .ri { vertical-align: -0.25em; }
#plFingersBtn .chev { transition: transform .2s; }
#plFingersBtn[aria-expanded="true"] .chev { transform: rotate(180deg); }
.sheet { position: absolute; left: 0; right: 0; bottom: 52px; z-index: 8; max-height: calc(100% - 120px); overflow: auto; padding: 16px; border-radius: 22px; background: var(--surface); box-shadow: var(--shadow); display: grid; gap: 14px; align-items: center; animation: rise .3s var(--spring); }
@media (min-width: 900px) { .sheet { grid-template-columns: minmax(0, 1fr) 190px; left: auto; width: min(820px, 100%); } }
.fret-wrap { overflow-x: auto; }
.fret-wrap svg { display: block; width: 100%; max-width: 580px; height: auto; margin: 0 auto; }
/* pantallas estrechas o bajas: las opciones del reproductor van en un panel */
@media (max-width: 899px), (max-height: 600px) {
  .pl-opts-btn { display: inline-flex; }
  .pl-opts { position: absolute; top: 54px; right: 0; z-index: 9; flex-direction: column; align-items: stretch; gap: 16px; width: min(320px, 100%); padding: 18px; border-radius: 22px; background: var(--surface); box-shadow: var(--shadow); animation: rise .3s var(--spring); }
  .pl-opts:not(.open) { display: none; }
  .speed { width: 100%; }
}
@media (max-width: 560px) {
  .pl-title h1 { font-size: 18px; }
  .pl-title p { display: none; }
  .hud .pts { font-size: 20px; }
  .mult { width: 36px; height: 36px; font-size: 13.5px; }
  .pl-btns .btn { width: 38px; height: 38px; }
  #plDemo span { display: none; }
}
@media (max-height: 520px) {
  .pl-title h1 { font-size: 17px; }
  .pl-title p { display: none; }
  .player { gap: 6px; }
}

/* ---------- Modal y avisos ---------- */
.modal { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; background: rgba(8, 6, 12, .62); backdrop-filter: blur(8px); padding: 16px; }
.modal-card { width: min(460px, 100%); max-height: 100%; overflow: auto; background: var(--surface); border-radius: 30px; padding: 26px 24px 22px; box-shadow: var(--shadow); animation: rise .45s var(--spring); text-align: center; }
@keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.97); } }
.modal-card h2 { font-size: 27px; }
.stars { display: flex; gap: 8px; justify-content: center; color: var(--surface-3); }
.stars .ri { width: 44px; height: 44px; }
.stars .on { color: var(--accent); animation: star .5s var(--spring) both; }
.stars .on:nth-child(2) { animation-delay: .15s; } .stars .on:nth-child(3) { animation-delay: .3s; }
@keyframes star { from { transform: scale(0) rotate(-40deg); } }
.res-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 16px; }
.res-grid div { padding: 10px 4px; border-radius: 14px; background: var(--surface-2); }
.res-grid b { display: block; font-family: var(--display); font-size: 21px; }
.res-grid span { font-size: 12px; color: var(--muted); }
.res-big { display: flex; justify-content: center; gap: 26px; margin-top: 14px; }
.res-big b { display: block; font-family: var(--display); font-size: 32px; font-weight: 700; line-height: 1.1; }
.res-big span { font-size: 12.5px; color: var(--muted); }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 70; background: var(--surface-3); color: var(--text); padding: 12px 16px; border-radius: 16px; font-size: 14px; box-shadow: var(--shadow); display: flex; gap: 10px; align-items: flex-start; max-width: min(520px, calc(100vw - 32px)); animation: rise .35s var(--spring); }
.toast .ri { color: var(--warn); margin-top: 2px; }
@media (orientation: portrait) and (max-width: 760px) { .toast { bottom: calc(86px + env(safe-area-inset-bottom, 0px)); } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

<body>
<div class="app">
  <nav class="rail" aria-label="Traste">
    <a class="rail-brand" href="#afinador" aria-label="Traste">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2.5c-7.4 0-12.5 3.2-12.5 8.6 0 6.6 6.6 14 11 18.1a2.2 2.2 0 0 0 3 0c4.4-4.1 11-11.5 11-18.1C28.5 5.7 23.4 2.5 16 2.5Z" fill="var(--accent)"/><path d="M9.5 11h13M11 15.5h10M13 20h6" stroke="var(--accent-ink)" stroke-width="1.9" stroke-linecap="round" opacity=".5"/></svg>
    </a>
    <a class="rail-item" href="#afinador" data-tab="afinador"><span data-icon="dashboard-3-line"></span>Afinar</a>
    <a class="rail-item" href="#acordes" data-tab="acordes"><span data-icon="hand"></span>Acordes</a>
    <a class="rail-item" href="#canciones" data-tab="canciones"><span data-icon="music-2-line"></span>Canciones</a>
    <div class="rail-end">
      <button type="button" class="rail-item" id="notationBtn" title="Nombres de las notas: Do Re Mi o C D E"><span class="key" id="notationKey">Do</span>Notas</button>
      <button type="button" class="rail-item mic" id="micBtn" data-on="false"><span id="micIcon" data-icon="mic-off-line"></span><span class="meter" id="micMeter"><i></i><i></i><i></i><i></i><i></i></span></button>
    </div>
  </nav>

  <main class="views">
    <!-- ======================= AFINADOR ======================= -->
    <section class="view" data-view="afinador" hidden>
      <div class="tuner">
        <div class="t-main">
          <div class="t-top">
            <button type="button" class="mode-chip" id="tnMode"><i></i><span id="tnModeText">Automático</span></button>
            <span class="faint num text-sm" id="tnFreq"></span>
          </div>
          <div class="readout">
            <div class="note-big" id="tnNote">—</div>
            <div class="sub" id="tnSub">Pulsa una cuerda al aire</div>
          </div>
          <div class="gauge" id="gauge" aria-hidden="true">
            <div class="band"></div>
            <div id="ticks"></div>
            <div class="needle" id="needle"></div>
          </div>
          <div class="gauge-scale num"><span>Grave</span><span>−25</span><span>0</span><span>+25</span><span>Aguda</span></div>
          <div class="hint" id="tnHint" aria-live="polite"></div>
        </div>
        <div class="t-strings">
          <div class="strings" id="tnStrings"></div>
          <div class="t-foot">
            <span><b id="tnProgress">0</b> <span class="muted">de 6 afinadas ·</span> <button type="button" class="link-btn" id="tnReset">empezar de nuevo</button></span>
            <span class="flex items-center gap-3" id="micBox" hidden>
              <select id="micSelect" aria-label="Micrófono"></select>
              <button type="button" class="link-btn" id="recalBtn">Comprobar micro</button>
            </span>
          </div>
        </div>
        <div class="overlay-cta" id="tunerCta">
          <div>
            <h3>Necesito oír tu guitarra</h3>
            <p>Activa el micrófono. El sonido se analiza en tu navegador y no sale de tu equipo.</p>
            <button type="button" class="btn btn-primary btn-lg" data-action="mic-on"><span data-icon="mic-line"></span>Activar micrófono</button>
          </div>
        </div>
      </div>
      <div class="cal-host overlay" data-cal-host="afinador" hidden></div>
    </section>

    <!-- ======================= ACORDES ======================= -->
    <section class="view" data-view="acordes" hidden>
      <nav class="lesson-path" id="lessonPath" aria-label="Lecciones"></nav>
      <div class="lesson-body scroll" id="lessonBody"></div>
      <div class="cal-host overlay" data-cal-host="acordes" hidden></div>
    </section>

    <!-- ======================= CANCIONES ======================= -->

   ============================================================ */

// Afinación estándar, de 6ª (Mi grave) a 1ª (Mi agudo), en MIDI
const OPEN_MIDI = [40, 45, 50, 55, 59, 64]; // índice 0 = cuerda 6
const stringMidi = (s) => OPEN_MIDI[6 - s];   // s: 1..6

const LETTERS = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
const LATIN = ['Do', 'Do#', 'Re', 'Re#', 'Mi', 'Fa', 'Fa#', 'Sol', 'Sol#', 'La', 'La#', 'Si'];
const LETTER_TO_PC = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };

const midiToFreq = (m) => 440 * Math.pow(2, (m - 69) / 12);
const freqToMidi = (f) => 69 + 12 * Math.log2(f / 440);

function noteToMidi(name) {
  const m = /^([A-G])([#b]?)(-?\d)$/.exec(name);
  if (!m) throw new Error('Nota no válida: ' + name);
  let pc = LETTER_TO_PC[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
  return 12 * (parseInt(m[3], 10) + 1) + pc;
}

/* ---------- Detección de tono: YIN (de Cheveigné & Kawahara, 2002) ---------- */
function yin(buf, sr, opts = {}) {
  const fmin = opts.fmin || 70, fmax = opts.fmax || 1400, thr = opts.threshold || 0.12;
  const tauMax = Math.min(Math.floor(sr / fmin), Math.floor(buf.length / 2));
  const tauMin = Math.max(2, Math.floor(sr / fmax));
  const W = buf.length - tauMax - 1;
  const d = new Float32Array(tauMax + 2);
  for (let tau = 1; tau <= tauMax + 1; tau++) {
    let s = 0;
    for (let i = 0; i < W; i++) { const x = buf[i] - buf[i + tau]; s += x * x; }
    d[tau] = s;
  }
  const c = new Float32Array(tauMax + 2); c[0] = 1;
  let run = 0;
  for (let tau = 1; tau <= tauMax + 1; tau++) { run += d[tau]; c[tau] = run > 0 ? d[tau] * tau / run : 1; }
  let tau = -1;
  for (let t = tauMin; t <= tauMax; t++) {
    if (c[t] < thr) { while (t + 1 <= tauMax && c[t + 1] < c[t]) t++; tau = t; break; }
  }
  if (tau < 0) {
    let best = tauMin;
    for (let t = tauMin; t <= tauMax; t++) if (c[t] < c[best]) best = t;
    if (c[best] > 0.3) return null;
    tau = best;
  }
  let est = tau;
  if (tau > 1 && tau < tauMax) {
    const s0 = c[tau - 1], s1 = c[tau], s2 = c[tau + 1], den = s0 + s2 - 2 * s1;
    if (den) est = tau + (s0 - s2) / (2 * den);
  }
  return { freq: sr / est, prob: 1 - c[tau] };
}

// Diezma a ~24 kHz con un filtro [1 2 1]/4 para abaratar YIN (la guitarra no pasa de ~1,4 kHz de fundamental)
function decimate(src, factor) {
  if (factor <= 1) return { buf: src, f: 1 };
  const n = Math.floor(src.length / factor), out = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const j = i * factor;
    out[i] = 0.25 * (src[j - 1] ?? src[j]) + 0.5 * src[j] + 0.25 * (src[j + 1] ?? src[j]);
  }
  return { buf: out, f: factor };
}

function rms(buf, from = 0) {
  let s = 0; for (let i = from; i < buf.length; i++) s += buf[i] * buf[i];
  return Math.sqrt(s / Math.max(1, buf.length - from));
}

/* ---------- Energía por semitono (máximo por banda, Stark & Plumbley 2009) ---------- */
// mags: magnitudes lineales del FFT (fftSize/2 valores)
function semitoneEnergies(mags, sr, fftSize, lo, hi) {
  const binHz = sr / fftSize, out = new Float32Array(hi - lo + 1);
  for (let m = lo; m <= hi; m++) {
    const f = midiToFreq(m);
    const a = Math.max(1, Math.ceil(f * 0.9715 / binHz)), b = Math.min(mags.length - 1, Math.floor(f * 1.0293 / binHz));
    let v = 0;
    if (b < a) v = mags[Math.round(f / binHz)] || 0;
    else for (let k = a; k <= b; k++) if (mags[k] > v) v = mags[k];
    out[m - lo] = v;
  }
  return out;
}

/* ---------- Reconocimiento de acordes por plantillas de armónicos ----------
   Como sabemos exactamente qué nota debe dar cada cuerda, comparamos el espectro (por semitonos)
   con la plantilla armónica de varias hipótesis: el acorde correcto, el acorde con una cuerda
   apagada, con una cuerda "X" sonando y el resto de acordes. Gana la que mejor explica el sonido. */
const V_LO = 40, V_HI = 92;
const HARM = [[0, 1], [12, 0.75], [19, 0.55], [24, 0.45], [28, 0.32], [31, 0.28], [34, 0.18], [36, 0.16]];
// Los micrófonos pequeños (móvil, portátil) apenas captan por debajo de ~150 Hz:
// las parciales graves pesan la mitad para no "echar en falta" cuerdas que sí suenan.
function voicingTemplate(midis, lo = V_LO, hi = V_HI) {
  const t = new Float32Array(hi - lo + 1);
  for (const m of midis) for (const [off, w] of HARM) { const k = m + off - lo; if (k >= 0 && k < t.length) t[k] += w * (m + off < 52 ? 0.5 : 1); }
  for (let i = 0; i < t.length; i++) t[i] = Math.sqrt(t[i]);
  return t;
}
// Compresión logarítmica: iguala cuerdas tocadas con distinta fuerza y la coloración del micrófono
function prepSemis(semis) {
  const v = new Float32Array(semis.length); let mx = 0;
  for (let i = 0; i < semis.length; i++) mx = Math.max(mx, semis[i]);
  for (let i = 0; i < semis.length; i++) v[i] = mx > 0 ? Math.log1p(30 * semis[i] / mx) : 0;
  return v;
}
function cosine(a, b) { let d = 0, x = 0, y = 0; for (let i = 0; i < a.length; i++) { d += a[i] * b[i]; x += a[i] * a[i]; y += b[i] * b[i]; } return x && y ? d / Math.sqrt(x * y) : 0; }

// hipótesis para un acorde esperado: [{kind:'ok'|'missing'|'extra'|'other', string?, id?, midis}]
function chordHypotheses(expected, library) {
  const hyps = [{ kind: 'ok', midis: expected.notes.map((n) => n.midi) }];
  if (expected.notes.length > 2) for (const n of expected.notes) {
    const rest = expected.notes.filter((x) => x !== n).map((x) => x.midi);
    hyps.push({ kind: 'missing', string: n.string, midi: n.midi, midis: rest });
  }
  for (let s = 1; s <= 6; s++) {
    if (expected.notes.some((n) => n.string === s) || (expected.dir === 'U' && s >= 5)) continue;
    hyps.push({ kind: 'extra', string: s, midi: stringMidi(s), midis: [...hyps[0].midis, stringMidi(s)] });
  }
  for (const [id, notes] of library) {
    const ms = notes.map((n) => n.midi);
    if (ms.slice().sort().join() === hyps[0].midis.slice().sort().join()) continue;
    hyps.push({ kind: 'other', id, midis: ms });
  }
  return hyps.map((h) => ({ ...h, tpl: voicingTemplate(h.midis) }));
}

// ok: el acorde esperado explica el sonido (o casi tan bien como la mejor hipótesis).
// confident: solo entonces se da un diagnóstico concreto; si no, se dice que no se ha oído claro.
function matchChord(semis, hyps, margin = 0.02) {
  const v = prepSemis(semis);
  let best = null, other = 0;
  const okScore = cosine(v, hyps[0].tpl);
  for (const h of hyps) {
    const s = cosine(v, h.tpl);
    if (h.kind === 'other' && s > other) other = s;
    if (!best || s > best.score) best = { ...h, score: s };
  }
  // una cuerda de más o de menos del mismo acorde se tolera (margin); otro acorde (p. ej. Mi frente
  // a Mi7, que se separan por una sola nota) nunca puede explicar el sonido mejor que el esperado
  const ok = okScore >= 0.6 && other - okScore < 0.006 && (best.kind === 'ok' || best.score - okScore < margin);
  const need = best.kind === 'missing' && best.string >= 5 ? 0.05 : 0.02;
  const confident = !ok && okScore >= 0.5 && best.kind !== 'ok' && best.score - okScore >= need;
  return { ok, score: okScore, best, confident };
}

// Nota nueva a partir de lo que "aparece" en el espectro tras un ataque (después − antes).
// Funciona aunque la cuerda anterior siga sonando, que es donde el detector de nota única duda.
const NOTE_TPL = [];
function newNote(flux, minScore = 0.55) {
  let mx = 0; for (const x of flux) if (x > mx) mx = x;
  if (mx <= 0) return null;
  const v = new Float32Array(flux.length);
  for (let i = 0; i < flux.length; i++) v[i] = Math.log1p(30 * flux[i] / mx);
  let best = null, bs = 0;
  for (let m = 40; m <= 77; m++) {
    const t = NOTE_TPL[m] || (NOTE_TPL[m] = voicingTemplate([m]));
    const s = cosine(v, t); if (s > bs) { bs = s; best = m; }
  }
  return bs >= minScore ? best : null;
}

/* ---------- Rasgueo en canciones (validado con grabaciones reales de GuitarSet) ----------
   Con audio real, exigir el acorde exacto solo acepta ~45 % de los rasgueos bien tocados, así que
   en canciones se usa una regla tolerante: vale salvo que otro acorde o "pocas cuerdas" expliquen
   mejor el sonido, varias notas del acorde tengan huella propia y lo que aparece en el ataque no sea
   una sola nota. Resultado con GuitarSet: 82 % de rasgueos correctos aceptados, 9 % de notas sueltas. */
function fewHypotheses(notes) {
  const ms = [...new Set(notes.map((n) => n.midi))], out = [];
  for (let i = 0; i < ms.length; i++) { out.push([ms[i]]); for (let j = i + 1; j < ms.length; j++) out.push([ms[i], ms[j]]); }
  return out.map((m) => ({ kind: 'few', midis: m, tpl: voicingTemplate(m) }));
}
function notePresence(semis, notes, thr = 0.45) {
  const v = prepSemis(semis); let mx = 0; for (const x of v) mx = Math.max(mx, x);
  const ms = [...new Set(notes.map((n) => n.midi))]; let p = 0;
  for (const m of ms) { const a = v[m - V_LO] || 0, b = (v[m + 12 - V_LO] || 0) * 0.85; if (Math.max(a, b) >= thr * mx) p++; }
  return { present: p, total: ms.length };
}
// parecido de lo que aparece en el ataque a una sola nota (1 = una nota clara)
function singleNoteLikeness(flux) {
  let mx = 0; for (const x of flux) mx = Math.max(mx, x);
  if (!mx) return 1;
  const v = new Float32Array(flux.length); for (let i = 0; i < flux.length; i++) v[i] = Math.log1p(30 * flux[i] / mx);
  let b = 0; for (let m = 40; m <= 77; m++) { const t = NOTE_TPL[m] || (NOTE_TPL[m] = voicingTemplate([m])); b = Math.max(b, cosine(v, t)); }
  return b;
}
function strumOk(semis, hyps, few, notes) {
  const v = prepSemis(semis), ok = cosine(v, hyps[0].tpl);
  let other = 0; for (const h of hyps) if (h.kind === 'other') other = Math.max(other, cosine(v, h.tpl));
  let fw = 0; for (const h of few) fw = Math.max(fw, cosine(v, h.tpl));
  if (ok < 0.5 || other - ok >= 0.03 || fw - ok >= 0.02) return false;
  const { present, total } = notePresence(semis, notes);
  return present >= Math.min(3, total) && present / total >= 0.6;
}

/* ---------- Síntesis de cuerda pulsada: Karplus-Strong con afinación fraccional ---------- */
function ksRender(freq, sr, dur = 2.4, opts = {}) {
  const n = Math.floor(sr * dur), out = new Float32Array(n);
  const D = sr / freq;
  let N = Math.floor(D - 0.5), frac = D - 0.5 - N;
  if (frac < 0.1) { N -= 1; frac += 1; }
  const C = (1 - frac) / (1 + frac); // paso-todo para el retardo fraccional
  const line = new Float32Array(N);
  const bright = opts.bright ?? 0.55;
  let p = 0, mean = 0;
  for (let i = 0; i < N; i++) { p += bright * ((Math.random() * 2 - 1) - p); line[i] = p; mean += p; }
  mean /= N; for (let i = 0; i < N; i++) line[i] -= mean;
  const t60 = opts.t60 ?? (freq < 150 ? 3.2 : freq < 300 ? 2.4 : 1.7);
  const g = Math.pow(10, -3 / (t60 * freq)); // pérdida por periodo
  let idx = 0, prev = 0, apx = 0, apy = 0;
  for (let i = 0; i < n; i++) {
    const x = line[idx];
    const avg = 0.5 * (x + prev); prev = x;
    const y = C * avg + apx - C * apy; apx = avg; apy = y;
    line[idx] = y * g;
    out[i] = x;
    idx = idx + 1 === N ? 0 : idx + 1;
  }
  const fade = Math.floor(sr * 0.06);
  for (let i = 0; i < fade; i++) out[n - 1 - i] *= i / fade;
  let peak = 0; for (let i = 0; i < n; i++) peak = Math.max(peak, Math.abs(out[i]));
  if (peak > 0) for (let i = 0; i < n; i++) out[i] *= 0.9 / peak;
  return out;
}

/* ---------- Partituras: melodías, acordes y niveles ---------- */
// "G3 A3:0.5 R:1 | ..." → [{midi|null, beats}]
function parseMelody(str) {
  return str.split(/\s+/).filter((t) => t && t !== '|').map((tok) => {
    const [n, b] = tok.split(':');
    return { midi: n === 'R' ? null : noteToMidi(n), beats: b ? parseFloat(b) : 1 };
  });
}

// Posición abierta (1ª posición): la cuerda con el traste más bajo; dedo = traste (1 dedo por traste)
function firstPosition(midi) {
  let best = null;
  for (let s = 1; s <= 6; s++) {
    const fret = midi - stringMidi(s);
    if (fret < 0 || fret > 5) continue;
    if (!best || fret < best.fret) best = { string: s, fret };
  }
  if (!best) return null;
  best.finger = best.fret === 0 ? 0 : Math.min(4, best.fret);
  best.midi = midi;
  return best;
}

// "G | C G | D:3 G:1" → [{chord, t, dur}]
function parseChordBars(str, bpb, start) {
  const out = []; let t = start;
  for (const bar of str.split('|')) {
    const toks = bar.trim().split(/\s+/).filter(Boolean);
    if (!toks.length) continue;
    const explicit = toks.some((x) => x.includes(':'));
    for (const tok of toks) {
      const [name, b] = tok.split(':');
      const dur = explicit ? parseFloat(b || '0') : bpb / toks.length;
      out.push({ chord: name, t, dur }); t += dur;
    }
  }
  return out;
}

const STRUM_PATTERNS = {
  4: [[0, 'D'], [1, 'D'], [1.5, 'U'], [2.5, 'U'], [3, 'D'], [3.5, 'U']],
  3: [[0, 'D'], [1, 'D'], [1.5, 'U'], [2, 'D'], [2.5, 'U']],
};

function chordNotes(chord, dir = 'D') {
  const notes = [];
  chord.frets.forEach((f, i) => {
    if (f < 0) return;
    const s = 6 - i;
    notes.push({ string: s, fret: f, finger: chord.fingers[i] || 0, midi: OPEN_MIDI[i] + f });
  });
  // en el rasgueo hacia arriba se tocan sobre todo las cuerdas agudas
  return dir === 'U' ? notes.filter((n) => n.string <= 4) : notes;
}

function buildSong(song, chords) {
  const melody = parseMelody(song.melody);
  const melodyEvents = []; let t = 0;
  for (const n of melody) {
    if (n.midi !== null) {
      const pos = firstPosition(n.midi);
      if (!pos) throw new Error(`${song.id}: nota fuera de posición ${n.midi}`);
      melodyEvents.push({ t, dur: n.beats, notes: [pos] });
    }
    t += n.beats;
  }
  const total = t;
  const pickup = song.pickup || 0;
  const chordTrack = parseChordBars(song.chords, song.bpb, pickup);
  const pattern = song.strum === 'bar' ? [[0, 'D']] : STRUM_PATTERNS[song.bpb] || STRUM_PATTERNS[4];
  const hard = [];
  for (const seg of chordTrack) {
    const ch = chords[seg.chord];
    if (!ch) throw new Error(`${song.id}: acorde desconocido ${seg.chord}`);
    const barStart = pickup + Math.floor((seg.t - pickup) / song.bpb + 1e-6) * song.bpb;
    for (const [off, dir] of pattern) {
      const at = barStart + off;
      if (at < seg.t - 1e-6 || at >= seg.t + seg.dur - 1e-6) continue;
      hard.push({ t: at, dur: 0.5, chord: seg.chord, dir, notes: chordNotes(ch, dir), first: Math.abs(at - seg.t) < 1e-6 });
    }
  }
  hard.forEach((e, i) => { e.dur = Math.min(1, (hard[i + 1]?.t ?? total) - e.t); });
  return { total, pickup, chordTrack, levels: { easy: melodyEvents, hard } };
}

if (typeof module !== 'undefined') module.exports = {
  OPEN_MIDI, stringMidi, LETTERS, LATIN, midiToFreq, freqToMidi, noteToMidi, yin, decimate, rms,
  semitoneEnergies, ksRender, parseMelody, firstPosition, parseChordBars,
  chordNotes, voicingTemplate, chordHypotheses, matchChord, newNote, fewHypotheses, notePresence, singleNoteLikeness, strumOk, V_LO, V_HI, buildSong, STRUM_PATTERNS,
};

  const m = /^([A-G])([#b]?)(.*)$/.exec(sym);
  const pc = (LETTER_TO_PC[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + 12) % 12;
  return { pc, letter: m[1] + m[2], suffix: m[3] };
}
function chordLabel(id, n = state.notation) { const p = chordParts(id); return n === 'latin' ? LATIN[p.pc] + (p.suffix.length > 2 ? ' ' : '') + p.suffix : p.letter + p.suffix; }
function chordLongName(id) { const p = chordParts(id); return `${LATIN[p.pc]} ${SUFFIX_NAME[p.suffix] ?? p.suffix}`; }

/* ============================================================
   Audio: salida (síntesis de guitarra) y micrófono
   ============================================================ */
const AudioEngine = {
  ctx: null, out: null, cache: new Map(),
  ensure() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC({ latencyHint: 'interactive' });
      const comp = this.ctx.createDynamicsCompressor();
      this.out = this.ctx.createGain(); this.out.gain.value = 0.9;
      this.out.connect(comp).connect(this.ctx.destination);
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
    return this.ctx;
  },
  buffer(freq) {
    const key = freq.toFixed(2);
    if (!this.cache.has(key)) {
      const ctx = this.ensure(), data = ksRender(freq, ctx.sampleRate, 2.4);
      const b = ctx.createBuffer(1, data.length, ctx.sampleRate); b.getChannelData(0).set(data);
      this.cache.set(key, b);
    }
    return this.cache.get(key);
  },
  pluck(freq, when = 0, gain = 0.5) {
    const ctx = this.ensure(), src = ctx.createBufferSource(), g = ctx.createGain();
    src.buffer = this.buffer(freq); g.gain.value = gain;
    src.connect(g).connect(this.out); src.start(ctx.currentTime + when);
    Mic.ignoreFor((when + 2.5) * 1000); // que la app no se escuche a sí misma
  },
  strum(notes, dir = 'D', when = 0) {
    const order = [...notes].sort((a, b) => (dir === 'D' ? b.string - a.string : a.string - b.string));
    order.forEach((n, i) => this.pluck(midiToFreq(n.midi), when + i * (dir === 'D' ? 0.016 : 0.012), dir === 'D' ? 0.3 : 0.22));
  },
  click(accent) {
    const ctx = this.ensure(), o = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime;
    o.frequency.value = accent ? 2600 : 2100; // por encima del registro de la guitarra
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(accent ? 0.35 : 0.2, t + 0.002); g.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
    o.connect(g).connect(this.out); o.start(t); o.stop(t + 0.06);
    Mic.clickUntil = performance.now() + 90;
  },
  // Tono de prueba: onda triangular. Aunque el altavoz no reproduzca la fundamental, conserva el
  // periodo y el detector mide la nota exacta (probado con altavoces que cortan por debajo de 700 Hz).
  tone(freq, dur) {
    const ctx = this.ensure(), o = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime;
    o.type = 'triangle'; o.frequency.value = freq;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.55, t + 0.02); g.gain.setValueAtTime(0.55, t + dur - 0.05); g.gain.linearRampToValueAtTime(0, t + dur);
    o.connect(g).connect(this.out); o.start(t); o.stop(t + dur + 0.02);
  },
};

// Identifica el micrófono físico (Chrome antepone "Predeterminado - " al micro del sistema)
function micKey(label, id) {
  const l = (label || '').replace(/^(default|predeterminado|por defecto|communications|comunicaciones)\s*[-–:]\s*/i, '').trim();
  return l || id || 'micro';
}

/* Micrófono. Cada fotograma devuelve el nivel, la nota estable (YIN) y, si hay un ataque, un objeto
   "attack" con la nota que lo identifica: la primera lectura estable 30-250 ms después del ataque
   o la nota que "aparece" en el espectro. Validado con grabaciones reales (GuitarSet): 88 % de notas
   reconocidas y 0,9 % de notas equivocadas aceptadas. Cada ataque solo puede usarse una vez. */
const Mic = {
  on: false, stream: null, source: null, analyser: null, short: null, td: null, fd: null, mags: null, fd2: null, mags2: null, sr: 48000, dec: 2,
  deviceId: '', label: '', key: '',
  ignoreUntil: 0, clickUntil: 0, hist: [], lastOnset: 0, prevRound: null, stableCount: 0, specHist: [], flux: null, attack: null, seq: 0,
  ignoreFor(ms) { this.ignoreUntil = Math.max(this.ignoreUntil, performance.now() + ms); },
  async start(deviceId) {
    if (this.on && !deviceId) return;
    if (!navigator.mediaDevices?.getUserMedia) { const e = new Error('Este navegador no permite usar el micrófono aquí.'); e.name = 'Unsupported'; throw e; }
    const ctx = AudioEngine.ensure();
    // Sin cancelación de eco, supresión de ruido ni control de ganancia: alteran las notas sostenidas
    const audio = { echoCancellation: false, noiseSuppression: false, autoGainControl: false };
    const want = deviceId || store.get('micDevice', '');
    let stream;
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: want ? { ...audio, deviceId: { exact: want } } : audio }); }
    catch (e) { if (want && !deviceId && e.name === 'OverconstrainedError') stream = await navigator.mediaDevices.getUserMedia({ audio }); else throw e; }
    if (this.on) this.stop(true);
    this.stream = stream;
    const track = stream.getAudioTracks()[0], st = track.getSettings?.() || {};
    this.deviceId = st.deviceId || ''; this.label = track.label || 'Micrófono'; this.key = micKey(track.label, st.deviceId);
    if (deviceId) store.set('micDevice', deviceId);
    this.source = ctx.createMediaStreamSource(stream);
    if (!this.analyser) {
      const an = ctx.createAnalyser(); an.fftSize = 16384; an.smoothingTimeConstant = 0;
      const mute = ctx.createGain(); mute.gain.value = 0; an.connect(mute).connect(ctx.destination);
      this.analyser = an; this.td = new Float32Array(an.fftSize); this.fd = new Float32Array(an.frequencyBinCount); this.mags = new Float32Array(an.frequencyBinCount);
      const sh = ctx.createAnalyser(); sh.fftSize = 4096; sh.smoothingTimeConstant = 0; sh.connect(mute);
      this.short = sh; this.fd2 = new Float32Array(sh.frequencyBinCount); this.mags2 = new Float32Array(sh.frequencyBinCount);
    }
    this.source.connect(this.analyser); this.source.connect(this.short);
    this.sr = ctx.sampleRate; this.dec = Math.max(1, Math.round(this.sr / 24000));
    track.addEventListener('ended', () => { this.stop(); toast('Se ha desconectado el micrófono.'); });
    this.hist = []; this.specHist = []; this.flux = null; this.attack = null; this.on = true;
    onMicChange();
  },
  stop(silent) {
    this.stream?.getTracks().forEach((t) => t.stop());
    try { this.source?.disconnect(); } catch { /* ya desconectado */ }
    this.on = false; this.source = null;
    if (!silent) onMicChange();
  },
  gate() { return Cal.running ? 0.0012 : state.cals[this.key]?.gate ?? 0.006; },
  latency() { return state.cals[this.key]?.latency ?? 0.12; },
  analyze(now) {
    this.analyser.getFloatTimeDomainData(this.td);
    const N = this.td.length, level = rms(this.td.subarray(N - 1024));
    const ignoring = now < this.ignoreUntil;
    let pitch = null;
    if (!ignoring && level > this.gate()) {
      const { buf, f } = decimate(this.td.subarray(N - 4096), this.dec);
      const r = yin(buf, this.sr / f);
      if (r && r.prob >= 0.9 && r.freq > 70 && r.freq < 1400) pitch = r;
    }
    const prevMin = this.hist.length ? Math.min(...this.hist) : level;
    this.hist.push(level); if (this.hist.length > 7) this.hist.shift();
    let onset = false;
    if (!ignoring && now > this.clickUntil && level > this.gate() * 1.4 && level > prevMin * 1.5 && now - this.lastOnset > 160) { onset = true; this.lastOnset = now; }
    const midi = pitch ? freqToMidi(pitch.freq) : null;
    const rd = midi == null ? null : Math.round(midi);
    if (rd != null && rd === this.prevRound && Math.abs(midi - rd) < 0.4) this.stableCount++; else this.stableCount = rd == null ? 0 : 1;
    this.prevRound = rd;
    const stable = this.stableCount >= 2 ? rd : null;
    // ataque: espectro antes / 90 ms después, y primera lectura estable
    const spec = this.shortSemis();
    this.specHist.push({ t: now, spec }); while (this.specHist.length > 6) this.specHist.shift();
    if (onset) {
      const before = [...this.specHist].reverse().find((h) => h.t <= now - 30);
      this.flux = before ? { t0: now, before: before.spec } : null;
      this.attack = { id: ++this.seq, t0: now, yin: null, flux: null, fluxVec: null, used: false, settled: false };
    }
    const a = this.attack;
    if (a && !ignoring) {
      if (stable != null && a.yin == null && now - a.t0 >= 30 && now - a.t0 <= 250) a.yin = stable;
      if (this.flux && now - this.flux.t0 >= 90) {
        const b = this.flux.before; this.flux = null;
        a.fluxVec = spec.map((v, i) => Math.max(0, v - b[i] * 1.1));
        a.flux = newNote(a.fluxVec);
      }
      a.settled = now - a.t0 > 260;
    }
    return { now, level, pitch, midi, onset, ignoring, stable, attack: a && now - a.t0 < 800 ? a : null };
  },
  shortSemis() {
    this.short.getFloatFrequencyData(this.fd2);
    for (let i = 0; i < this.fd2.length; i++) this.mags2[i] = Math.pow(10, this.fd2[i] / 20);
    return semitoneEnergies(this.mags2, this.sr, this.short.fftSize, V_LO, V_HI);
  },
  semis() {
    this.analyser.getFloatFrequencyData(this.fd);
    for (let i = 0; i < this.fd.length; i++) this.mags[i] = Math.pow(10, this.fd[i] / 20);
    return semitoneEnergies(this.mags, this.sr, this.analyser.fftSize, V_LO, V_HI);
  },
};
const attackNotes = (a) => [a.yin, a.flux].filter((x) => x != null);
const sameNote = (m, want) => m === want || Math.abs(m - want) === 12;

async function ensureMic() {
  if (Mic.on) return true;
  try { await Mic.start(); return true; } catch (e) {
    let msg;
    if (e.name === 'NotAllowedError' || e.name === 'SecurityError') msg = 'No tengo permiso para usar el micrófono. Permítelo desde el icono del candado de la barra de direcciones y vuelve a intentarlo.';
    else if (e.name === 'NotFoundError') msg = 'No encuentro ningún micrófono conectado.';
    else msg = 'No he podido abrir el micrófono. ' + (e.message || '');
    if (window.self !== window.top) msg += ' Si ves Traste dentro de otra página, ábrelo directamente en Chrome, Edge o Firefox.';
    toast(msg, 10000); return false;
  }
}
async function micReady() {
  if (!(await ensureMic())) return false;
  if (Cal.needed()) { Cal.sync(); return false; }
  return true;
}
function onMicChange() {
  const b = $('#micBtn'); b.dataset.on = String(Mic.on);
  b.title = Mic.on ? `${Mic.label} · pulsa para apagarlo` : 'Activar el micrófono';
  $('#micIcon').outerHTML = icon(Mic.on ? 'mic-line' : 'mic-off-line', '').replace('<svg', '<svg id="micIcon"');
  if (!Mic.on) renderMeter(0);
  $('#tunerCta').hidden = Mic.on;
  $('#micBox').hidden = !Mic.on;
  if (Mic.on) fillMicSelect();
  Cal.sync();
}
async function fillMicSelect() {
  try {
    const devs = (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === 'audioinput' && d.deviceId);
    const sel = $('#micSelect');
    sel.innerHTML = devs.map((d, i) => `<option value="${d.deviceId}">${d.label || 'Micrófono ' + (i + 1)}</option>`).join('');
    const cur = devs.find((d) => d.deviceId === Mic.deviceId) || devs.find((d) => micKey(d.label, d.deviceId) === Mic.key);
    if (cur) sel.value = cur.deviceId;
    sel.hidden = devs.length < 2;
  } catch { /* sin lista de dispositivos */ }
}
function renderMeter(level) {
  const db = 20 * Math.log10(level + 1e-9), lit = clamp(Math.round((db + 62) / 10), 0, 5);
  $$('#micMeter i').forEach((el, i) => { el.classList.toggle('lit', i < lit); el.classList.toggle('hot', i < lit && i >= 4); });
}

/* ============================================================
   Comprobación del micrófono (silencio + tono de prueba), por micrófono
   ============================================================ */
const Cal = {
  running: false, phase: 'intro', forced: false, steps: [{ s: '', res: '' }, { s: '', res: '' }], allOk: false, listener: null,
  needed() { return Mic.on && (this.forced || this.running || this.phase === 'done' || !state.cals[Mic.key]); },
  sync() {
    $$('[data-cal-host]').forEach((h) => {
      const show = this.needed() && h.dataset.calHost === state.view;
      h.hidden = !show;
      if (show) this.render(h);
    });
  },
  render(h) {
    const stIcon = (st, i) => (st === 'ok' ? icon('check-line') : st === 'warn' ? '!' : String(i + 1));
    const items = [
      ['Silencio', 'No toques nada: mido el ruido de la sala.'],
      ['Tono de prueba', 'Sonarán tres notas por el altavoz y compruebo que el micrófono las oye afinadas.'],
    ];
    let acts = '';
    if (this.phase === 'intro') acts = `<button type="button" class="btn btn-primary btn-lg w-full" data-cal="start">${icon('play-fill')}Comenzar</button>`;
    else if (this.phase === 'run') acts = `<button type="button" class="btn btn-soft btn-lg w-full" disabled>Comprobando…</button>`;
    else acts = `<div class="flex gap-2">${this.allOk ? '' : `<button type="button" class="btn btn-soft btn-lg flex-1" data-cal="start">${icon('restart-line')}Repetir</button>`}<button type="button" class="btn btn-primary btn-lg flex-1" data-cal="done">${this.allOk ? icon('check-line') + 'Listo' : 'Seguir así'}</button></div>`;
    h.innerHTML = `<div class="cal">
      <h3>${this.phase === 'done' ? (this.allOk ? 'Micrófono listo' : 'Micrófono comprobado') : 'Primero, comprobemos tu micrófono'}</h3>
      ${this.phase === 'done' ? '' : `<p class="muted">Son unos 8 segundos y solo se hace una vez con cada micrófono${Mic.label ? ` (${Mic.label})` : ''}.</p>`}
      ${this.phase === 'intro' ? `<div class="vol-note">${icon('volume-up-line')}Sube el volumen y quítate los auriculares.</div>` : ''}
      <div class="cal-list">${items.map(([t, d], i) => `<div class="cal-item" data-s="${this.steps[i].s}"><div class="st">${stIcon(this.steps[i].s, i)}</div><div><b>${t}</b><p>${d}</p>${this.steps[i].res ? `<div class="res">${this.steps[i].res}</div>` : ''}</div></div>`).join('')}</div>
      ${this.phase === 'run' ? '<div class="bar"><div data-cal-level></div></div>' : ''}
      ${acts}
    </div>`;
  },
  setStep(i, s, res) { this.steps[i] = { s, res: res ?? this.steps[i].res }; this.sync(); },
  collect(ms, fn) { return new Promise((res) => { const t0 = performance.now(); this.listener = (f, now) => { fn(f, now); if (now - t0 >= ms) { this.listener = null; res(); } }; }); },
  async testTone(freq) {
    const t0 = performance.now(); let first = null; const errs = [];
    Mic.ignoreUntil = 0;
    AudioEngine.tone(freq, 0.9);
    await this.collect(1300, (f, now) => {
      if (!f.pitch) return;
      let c = (freqToMidi(f.pitch.freq) - freqToMidi(freq)) * 100;
      if (Math.abs(Math.abs(c) - 1200) < 60) c = Math.abs(c) - 1200; // salto de octava
      if (Math.abs(c) < 60) { if (first == null) first = now - t0; if (now - t0 > 350 && now - t0 < 850) errs.push(c); }
    });
    return { ok: first != null && errs.length > 3, latency: first != null ? Math.max(0, first - 45) / 1000 : null, err: errs.length ? errs.reduce((a, b) => a + Math.abs(b), 0) / errs.length : null };
  },
  async run() {
    if (this.running || !(await ensureMic())) return;
    this.running = true; this.phase = 'run'; this.steps = [{ s: 'run', res: '' }, { s: '', res: '' }]; this.sync();
    const key = Mic.key;
    try {
      const lv = []; await this.collect(2000, (f) => lv.push(f.level));
      lv.sort((a, b) => a - b);
      // percentil 30: un golpe o una cuerda que suene durante la medida no dispara el umbral
      const noise = lv[Math.floor(lv.length * 0.3)] || 0.001, noisy = noise > 0.02;
      this.setStep(0, noisy ? 'warn' : 'ok', noisy ? 'Hay bastante ruido. Funcionará, pero mejor en un sitio tranquilo.' : 'Sala tranquila.');
      this.setStep(1, 'run');
      const rs = [];
      for (const fq of [196, 330, 440]) { rs.push(await this.testTone(fq)); await new Promise((r) => setTimeout(r, 200)); }
      const good = rs.filter((r) => r.ok);
      const lats = good.map((r) => r.latency).sort((a, b) => a - b);
      const latency = lats.length ? lats[lats.length >> 1] : 0.12;
      const err = good.length ? good.reduce((a, r) => a + r.err, 0) / good.length : 0;
      const toneOk = good.length >= 2;
      this.setStep(1, toneOk ? 'ok' : 'warn', toneOk
        ? `Oigo ${good.length} de 3 notas afinadas (desvío de ${fmt(err)} cents).`
        : 'No he oído bien las notas. Con auriculares es normal y puedes seguir; si no, sube el volumen y repite.');
      state.cals[key] = { noise, gate: clamp(noise * 3, 0.002, 0.02), latency, toneOk, label: Mic.label, at: Date.now() };
      store.set('cals', state.cals);
      this.allOk = toneOk && !noisy;
      this.phase = 'done';
      if (this.allOk) setTimeout(() => { if (this.phase === 'done' && this.allOk) this.finish(); }, 1600);
    } finally {
      this.running = false; this.sync();
    }
  },
  finish() { this.phase = 'intro'; this.forced = false; this.steps = [{ s: '', res: '' }, { s: '', res: '' }]; this.sync(); },
  recheck() { this.forced = true; this.phase = 'intro'; this.sync(); },
  frame(f, now) {
    if (!f) return;
    if (this.running) { const w = clamp((20 * Math.log10(f.level + 1e-9) + 70) / 60, 0, 1) * 100 + '%'; $$('[data-cal-level]').forEach((el) => { el.style.width = w; }); }
    if (this.listener) this.listener(f, now);
  },
};
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-cal]'); if (!b) return;
  if (b.dataset.cal === 'start') Cal.run(); else Cal.finish();
});

/* ============================================================
   Dibujos SVG: diagrama de acorde, mano, mástil
   ============================================================ */
function chordDiagram(ch, res = {}) {
  const sx = 32, sy = 42, L = 34, T = 46;
  const fretted = ch.frets.filter((f) => f > 0);
  const maxF = Math.max(0, ...fretted), minF = Math.min(99, ...fretted);
  const base = maxF <= 4 ? 1 : minF, nF = Math.max(4, maxF - base + 1);
  const W = L + 5 * sx + 30, H = T + nF * sy + 34, xs = (i) => L + i * sx;
  let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="font-family:var(--font);max-width:100%;height:auto" role="img" aria-label="Diagrama del acorde">`;
  for (let i = 0; i < 6; i++) if (res[6 - i] === 'now') s += `<rect x="${xs(i) - 15}" y="${T - 34}" width="30" height="${nF * sy + 60}" rx="15" fill="var(--accent-soft)"/>`;
  s += `<rect x="${xs(0)}" y="${T}" width="${5 * sx}" height="${nF * sy}" rx="3" fill="var(--surface-2)"/>`;
  for (let k = 0; k <= nF; k++) {
    const y = T + k * sy;
    s += k === 0 && base === 1 ? `<rect x="${xs(0) - 2}" y="${y - 6}" width="${5 * sx + 4}" height="7" rx="2" fill="var(--text)"/>` : `<line x1="${xs(0)}" x2="${xs(5)}" y1="${y}" y2="${y}" stroke="var(--line-2)" stroke-width="2"/>`;
  }
  if (base > 1) s += `<text x="${xs(0) - 10}" y="${T + sy * 0.5 + 5}" text-anchor="end" font-size="13" font-weight="600" fill="var(--muted)">${base}ª</text>`;
  for (let i = 0; i < 6; i++) s += `<line x1="${xs(i)}" x2="${xs(i)}" y1="${T}" y2="${T + nF * sy}" stroke="var(--muted)" stroke-opacity=".75" stroke-width="${2.6 - i * 0.32}"/>`;
  for (let i = 0; i < 6; i++) {
    const f = ch.frets[i], st = res[6 - i], col = st === 'bad' ? 'var(--bad)' : st === 'ok' ? 'var(--ok)' : st === 'now' ? 'var(--accent)' : null;
    if (f < 0) s += `<g stroke="${col || 'var(--faint)'}" stroke-width="2.2" stroke-linecap="round"><line x1="${xs(i) - 6}" y1="${T - 24}" x2="${xs(i) + 6}" y2="${T - 12}"/><line x1="${xs(i) + 6}" y1="${T - 24}" x2="${xs(i) - 6}" y2="${T - 12}"/></g>`;
    if (f === 0) s += `<circle cx="${xs(i)}" cy="${T - 18}" r="7" fill="none" stroke="${col || 'var(--open)'}" stroke-width="2.2"/>`;
    s += `<text x="${xs(i)}" y="${H - 8}" text-anchor="middle" font-size="12.5" font-weight="650" fill="${col || (f >= 0 ? 'var(--muted)' : 'var(--faint)')}">${f >= 0 ? pcName(OPEN_MIDI[i] + f) : ''}</text>`;
  }
  const b = ch.barre;
  let bi1 = -1, bi2 = -1;
  if (b) {
    bi1 = 6 - b.from; bi2 = 6 - b.to; const y = T + (b.fret - base + 0.5) * sy;
    s += `<rect x="${xs(bi1) - 14}" y="${y - 14}" width="${xs(bi2) - xs(bi1) + 28}" height="28" rx="14" fill="${fingerVar(b.finger)}"/>`;
    s += `<text x="${xs(bi1)}" y="${y + 4.5}" text-anchor="middle" font-size="13" font-weight="750" fill="var(--dot-ink)">${b.finger}</text>`;
  }
  for (let i = 0; i < 6; i++) {
    const f = ch.frets[i]; if (f <= 0) continue;
    if (b && f === b.fret && ch.fingers[i] === b.finger && i >= bi1 && i <= bi2) continue;
    const y = T + (f - base + 0.5) * sy, st = res[6 - i];
    s += `<circle cx="${xs(i)}" cy="${y}" r="14" fill="${fingerVar(ch.fingers[i])}" ${st === 'bad' ? 'stroke="var(--bad)" stroke-width="3"' : ''}/>`;
    s += `<text x="${xs(i)}" y="${y + 4.5}" text-anchor="middle" font-size="13.5" font-weight="750" fill="var(--dot-ink)">${ch.fingers[i]}</text>`;
  }
  return s + '</svg>';
}

// Mano izquierda vista desde la palma: pulgar a la izquierda y dedos 1-4 de izquierda a derecha
function handSVG(active, w = 150) {
  const F = [null, { x: 76, top: 40 }, { x: 103, top: 22 }, { x: 130, top: 30 }, { x: 155, top: 56 }];
  let s = `<svg viewBox="0 0 200 214" width="${w}" style="font-family:var(--font);max-width:100%;height:auto;overflow:visible" role="img" aria-label="Número y color de cada dedo">`;

  s += `<text x="29" y="128" text-anchor="middle" font-size="12" font-weight="700" fill="var(--faint)">P</text>`;
  for (let f = 1; f <= 4; f++) {

    s += `<text x="${d.x}" y="${d.top + 19}" text-anchor="middle" font-size="13" font-weight="750" fill="${on ? 'var(--dot-ink)' : fingerVar(f)}">${f}</text>`;

}
function fingerLegend(active) {
  return `<div class="legend">${[1, 2, 3, 4].map((f) => `<span style="${active && !active.has(f) ? 'opacity:.45' : ''}"><i style="background:${fingerVar(f)}"></i>${f} ${FINGERS[f].n}</span>`).join('')}</div>`;
}

// Mástil horizontal (cuerda 1 arriba, como en la tablatura) + columna de mano derecha
function fretboardSVG(e) {
  const shape = e ? (e.chord ? chordNotes(CHORDS[e.chord]) : e.notes) : [];
  const played = new Set(e ? e.notes.map((n) => n.string) : []);
  const isChord = !!(e && (e.chord || e.notes.length > 1));
  const maxF = Math.max(0, ...shape.map((n) => n.fret)), nF = Math.max(5, maxF);
  const rowH = 28, top = 40, labelW = 44, markW = 30, fw = 64, nutX = labelW + markW + 8;
  const boardR = nutX + nF * fw, rhX = boardR + 46, W = rhX + 40, H = top + 5 * rowH + 34, y = (s) => top + (s - 1) * rowH;
  let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" style="font-family:var(--font)" role="img" aria-label="Dónde poner los dedos">`;
  s += `<text x="${nutX}" y="16" font-size="12" font-weight="600" fill="var(--muted)">Mano izquierda</text>`;
  s += `<text x="${rhX}" y="16" text-anchor="middle" font-size="12" font-weight="600" fill="var(--muted)">Derecha</text>`;
  s += `<rect x="${nutX}" y="${y(1) - 13}" width="${nF * fw}" height="${5 * rowH + 26}" rx="6" fill="var(--surface-2)"/>`;
  for (const k of [3, 5, 7, 9]) if (k <= nF) s += `<circle cx="${nutX + (k - 0.5) * fw}" cy="${(y(3) + y(4)) / 2}" r="5" fill="var(--line-2)"/>`;
  for (let k = 1; k <= nF; k++) {
    s += `<line x1="${nutX + k * fw}" x2="${nutX + k * fw}" y1="${y(1) - 13}" y2="${y(6) + 13}" stroke="var(--line-2)" stroke-width="2"/>`;
    s += `<text x="${nutX + (k - 0.5) * fw}" y="${H - 4}" text-anchor="middle" font-size="11" fill="var(--faint)">${k}</text>`;
  }
  s += `<rect x="${nutX - 4}" y="${y(1) - 13}" width="6" height="${5 * rowH + 26}" rx="2" fill="var(--text)" fill-opacity=".85"/>`;
  for (let st = 1; st <= 6; st++) {
    s += `<line x1="${nutX}" x2="${boardR}" y1="${y(st)}" y2="${y(st)}" stroke="var(--muted)" stroke-opacity=".7" stroke-width="${1 + (st - 1) * 0.32}"/>`;
    s += `<text x="${labelW - 6}" y="${y(st) + 4}" text-anchor="end" font-size="12" font-weight="600" fill="var(--muted)">${pcName(stringMidi(st))}</text>`;
    const n = shape.find((x) => x.string === st), mx = labelW + markW / 2, on = played.has(st);
    if (n && n.fret === 0 && on) s += `<circle cx="${mx}" cy="${y(st)}" r="7.5" fill="none" stroke="var(--open)" stroke-width="2.2"/>`;
    else if (isChord && !n) s += `<g stroke="var(--faint)" stroke-width="2" stroke-linecap="round"><line x1="${mx - 5}" y1="${y(st) - 5}" x2="${mx + 5}" y2="${y(st) + 5}"/><line x1="${mx + 5}" y1="${y(st) - 5}" x2="${mx - 5}" y2="${y(st) + 5}"/></g>`;
    if (on) s += `<circle cx="${rhX}" cy="${y(st)}" r="8" fill="var(--accent)"/>`;
    else s += `<g stroke="var(--faint)" stroke-width="2" stroke-linecap="round" opacity=".7"><line x1="${rhX - 5}" y1="${y(st) - 5}" x2="${rhX + 5}" y2="${y(st) + 5}"/><line x1="${rhX + 5}" y1="${y(st) - 5}" x2="${rhX - 5}" y2="${y(st) + 5}"/></g>`;
  }
  const b = e?.chord && CHORDS[e.chord].barre;
  if (b) s += `<rect x="${nutX + (b.fret - 0.5) * fw - 12}" y="${y(b.to) - 12}" width="24" height="${y(b.from) - y(b.to) + 24}" rx="12" fill="${fingerVar(b.finger)}"/>`;
  for (const n of shape) {
    if (n.fret <= 0) continue;
    if (b && n.fret === b.fret && n.finger === b.finger && n.string !== b.to) continue;
    const cx = nutX + (n.fret - 0.5) * fw, dim = !played.has(n.string);
    s += `<circle cx="${cx}" cy="${y(n.string)}" r="12" fill="${fingerVar(n.finger)}" fill-opacity="${dim ? 0.45 : 1}"/>`;
    s += `<text x="${cx}" y="${y(n.string) + 4.5}" text-anchor="middle" font-size="12.5" font-weight="750" fill="var(--dot-ink)">${n.finger}</text>`;
  }
  return s + '</svg>';
}

/* ============================================================
   Afinador: automático por defecto, cuerdas dibujadas, tocar una cuerda = elegirla
   ============================================================ */
const STRING_TH = { 6: 4.4, 5: 3.7, 4: 3, 3: 2.4, 2: 1.9, 1: 1.5 };
const Tuner = {
  mode: 'auto', sel: 6, cur: null, lock: null, done: new Set(), hold: 0, hist: [], shown: 0, target: 0, lastSeen: 0, live: false, cents: 0, level: 0, phase: 0, last: {},
  init() {
    const ticks = $('#ticks');
    for (let c = -50; c <= 50; c += 5) {
      const d = document.createElement('div');
      d.className = 'tick' + (c === 0 ? ' zero' : c % 25 === 0 ? ' major' : '');
      d.style.left = (c + 50) + '%'; ticks.appendChild(d);
    }
    $('#tnStrings').addEventListener('click', (e) => {
      const row = e.target.closest('[data-s]'); if (!row) return;
      const s = +row.dataset.s;
      this.sel = s; this.setMode('manual');
      AudioEngine.pluck(midiToFreq(stringMidi(s)), 0, 0.7);
    });
    $('#tnMode').addEventListener('click', () => { if (this.mode === 'manual') this.setMode('auto'); else toast('Para elegir una cuerda, tócala en el dibujo.', 3500, 'information-line'); });
    $('#tnReset').addEventListener('click', () => { this.done.clear(); this.hold = 0; this.renderStrings(); });

  setMode(m) {

  },
  renderStrings() {
    $('#tnStrings').innerHTML = [6, 5, 4, 3, 2, 1].map((s) => `
      <button type="button" class="str ${this.done.has(s) ? 'done' : ''} ${this.mode === 'manual' && this.sel === s ? 'sel' : ''}" data-s="${s}" style="--th:${STRING_TH[s]}px" aria-label="Cuerda ${s}, ${stringName(s)}: tócala para afinar solo esta">

  frame(f, dt, now) {
    if (f && !Cal.needed()) {
      // anclaje: tras un ataque se decide la cuerda y, hasta el siguiente, se ignoran lecturas lejanas
      // (resonancias de otras cuerdas o armónicos): así la lectura no "salta" entre notas

    const g = $('#gauge'); g.classList.toggle('live', this.live); g.classList.toggle('in', inTune);
    const s = this.live ? this.cur : this.mode === 'manual' ? this.sel : null;
    this.set('#tnNote', s ? `${pcName(stringMidi(s))}<small>${s}ª</small>` : '—');

      const rs = +row.dataset.s, active = this.live && rs === this.cur;

      let d = 'M0 13'; for (let x = 8; x <= 400; x += 8) { const env = Math.sin(Math.PI * x / 400); d += ` L${x} ${(13 + amp * env * Math.sin(this.phase + x / 26)).toFixed(1)}`; }
      path.setAttribute('d', d); path.setAttribute('stroke', inTune ? PAL.ok : PAL.text);
      row.querySelector('.info').textContent = inTune ? 'Bien' : `${this.cents > 0 ? '+' : ''}${Math.round(this.cents)}`;
    });
    if (this.live) {
      this.set('#tnFreq', `${fmt(this.freq)} Hz`);
      const off = Math.abs(this.cents) > 100 ? `suena ${pcName(this.heard)}${octave(this.heard)}, muy lejos de ${pcName(stringMidi(this.cur))}` : `${this.cents > 0 ? '+' : ''}${Math.round(this.cents)} cents`;
      this.set('#tnSub', `${this.cur}ª cuerda · ${off}`);
      const far = Math.abs(this.cents) > 50 ? ' bastante' : '';
      this.set('#tnHint', inTune ? `<span style="color:var(--ok)">${icon('checkbox-circle-fill')}</span><span style="color:var(--ok)">${this.done.has(this.cur) ? 'Afinada' : 'Mantén… casi está'}</span>`
        : this.cents < 0 ? `${icon('arrow-up-line')}<span>Grave: aprieta la clavija${far}</span>`
        : `${icon('arrow-down-line')}<span>Aguda: afloja la clavija${far}</span>`);
    } else {
      this.set('#tnFreq', '');
      this.set('#tnSub', this.mode === 'manual' ? `Pulsa la ${this.sel}ª cuerda al aire` : 'Pulsa una cuerda al aire');
      this.set('#tnHint', this.done.size === 6 ? `<span style="color:var(--ok)">${icon('checkbox-circle-fill')}</span><span style="color:var(--ok)">¡Guitarra afinada!</span>` : '');
    }
  },
};

/* ============================================================
